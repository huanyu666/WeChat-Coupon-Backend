# 状态提示语配置文件

[get_link_flow]
# "获取链接" 功能的提示语

# 触发关键词
trigger_keyword = "获取链接"

# 请求P值的提示
request_p_value = "请输入P值"

# 确认P值的提示
confirm_p_value = "已记录P值，请发送链接，或发送退出后切换其他P值。"

# 处理中提示
processing = "正在处理，请稍候..."

# 成功提示模板
success_template = "{link}"

# 错误提示
error_invalid_link = "链接格式不正确，请重新发送正确的小程序链接或输入取消/退出取消操作"
error_api_failed = "API调用失败: {error}"
error_unknown = "处理失败，请稍后重试"

# 取消操作
cancel_keywords = ["取消", "退出"]
cancel_message = "已取消操作"

# 询问服务类型（验证激活码后）
request_service_choice = "请选择服务类型：\n<a href=\"weixin://bizmsgmenu?msgmenuid=1&msgmenucontent=1\">1. P值链接转换</a>\n<a href=\"weixin://bizmsgmenu?msgmenuid=1&msgmenucontent=2\">2. 自定义链接</a>\n\n请输入 1 或 2"
error_invalid_service_choice = "输入无效，请输入 1 或 2"

# 询问链接类型
request_link_type = "请选择链接类型：\n<a href=\"weixin://bizmsgmenu?msgmenuid=1&msgmenucontent=1\">1. 原始链接</a>\n<a href=\"weixin://bizmsgmenu?msgmenuid=1&msgmenucontent=2\">2. MP链接（mp://格式）</a>\n\n请输入 1 或 2"
confirm_link_type_original = "已选择：原始链接"
confirm_link_type_mp = "已选择：MP链接"
error_invalid_link_type = "输入无效，请输入 1 或 2"

# 生成链接流程配置
[generate_link_flow]
# "生成链接" 功能的提示语

# 触发关键词
trigger_keyword = "生成链接"

# 请求appid的提示
request_custom_appid = "请输入小程序appid："

# 请求path的提示
request_custom_path = "请输入小程序路径（path）："

# 询问是否转换为MP链接
request_mp_choice = "是否需要转换为MP链接？\n<a href=\"weixin://bizmsgmenu?msgmenuid=1&msgmenucontent=1\">1. 原始链接</a>\n<a href=\"weixin://bizmsgmenu?msgmenuid=1&msgmenucontent=2\">2. MP链接（mp://格式）</a>\n\n请输入 1 或 2"
error_invalid_mp_choice = "输入无效，请输入 1 或 2"

# 错误提示
error_empty_appid = "appid不能为空，请重新输入："
error_empty_path = "path不能为空，请重新输入："

# 取消操作
cancel_keywords = ["取消", "退出"]
cancel_message = "已取消操作"

