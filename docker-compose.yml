services:
  app:
    build:
      context: .
    image: wx-coupon-backend:local
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "${WX_HTTP_PORT:-8080}:80"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      WX_SERVICE_ENV: ${WX_SERVICE_ENV:-prod}
      WX_SERVICE_DEPLOYMENT_NAME: ${WX_SERVICE_DEPLOYMENT_NAME:-wx-coupon-prod}
      WX_SERVICE_PUBLIC_URL: ${WX_SERVICE_PUBLIC_URL:-http://154.219.115.75:8080}
      WX_SERVICE_ROOT: /app
      WX_SERVICE_DATA_DIR: /data
      WX_SERVICE_CONFIG_FILE: ${WX_SERVICE_CONFIG_FILE:-}
      WX_SERVICE_RUNTIME_DIR: /run/wx_service-python
      WX_SERVICE_LOG_DIR: /logs
      WX_SERVICE_SOCKET_PATH: ""
      WX_SERVICE_AUTO_START_GO: ${WX_SERVICE_AUTO_START_GO:-true}
      GO_INTERNAL_API_SOCKET_PATH: /run/wx_service/meituan-query-internal.sock
      GO_SHORTLINK_PUBLIC_BASE_URL: ${GO_SHORTLINK_PUBLIC_BASE_URL:-http://localhost:8080}
      WX_SERVICE_REDIS_URL: ${WX_SERVICE_REDIS_URL:-redis://redis:6379/0}
      WX_SERVICE_REDIS_PASSWORD: ${WX_SERVICE_REDIS_PASSWORD:-}
      WX_SERVICE_REDIS_SOCKET_TIMEOUT_SECONDS: ${WX_SERVICE_REDIS_SOCKET_TIMEOUT_SECONDS:-1.5}
      WX_SERVICE_REDIS_HEALTH_CHECK_INTERVAL_SECONDS: ${WX_SERVICE_REDIS_HEALTH_CHECK_INTERVAL_SECONDS:-30}
      WX_PROXY_API_URL: ${WX_PROXY_API_URL:-}
      WX_ORDER_RANKINGS_LINK_SECRET: ${WX_ORDER_RANKINGS_LINK_SECRET:-}
      WX_LOGIN_FAILURE_WINDOW_SECONDS: ${WX_LOGIN_FAILURE_WINDOW_SECONDS:-900}
      WX_LOGIN_FAILURE_MAX_ATTEMPTS: ${WX_LOGIN_FAILURE_MAX_ATTEMPTS:-8}
      WX_LOGIN_LOCK_SECONDS: ${WX_LOGIN_LOCK_SECONDS:-900}
      WX_WECHAT_MAX_BODY_BYTES: ${WX_WECHAT_MAX_BODY_BYTES:-262144}
      MERCHANT_BENEFITS_SERVICE_URL: http://merchant-benefits:18180
    volumes:
      - ./runtime-data:/data
      - ./runtime-data:/app/data
      - ./logs:/logs
      - go-runtime:/run/wx_service
      - redis-runtime:/run/redis
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1/healthz', timeout=2).read()\""]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  merchant-benefits:
    build:
      context: ./merchant-benefits
    image: wx-coupon-merchant-benefits:local
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      PORT: 18180
      MERCHANT_BENEFITS_WORKERS: ${MERCHANT_BENEFITS_WORKERS:-4}
      MERCHANT_BENEFITS_QUEUE_LIMIT: ${MERCHANT_BENEFITS_QUEUE_LIMIT:-50}
      MERCHANT_BENEFITS_TIMEOUT_MS: ${MERCHANT_BENEFITS_TIMEOUT_MS:-15000}
      MERCHANT_BENEFITS_UPSTREAM_TIMEOUT_MS: ${MERCHANT_BENEFITS_UPSTREAM_TIMEOUT_MS:-6000}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18180/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p /run/redis
        chmod 777 /run/redis
        exec redis-server --appendonly yes --port 6379 --unixsocket /run/redis/redis-server.sock --unixsocketperm 777
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping && redis-cli -s /run/redis/redis-server.sock ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis-data:/data
      - redis-runtime:/run/redis

volumes:
  redis-data:
  go-runtime:
  redis-runtime:
