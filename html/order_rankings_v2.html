<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>接单时间排行榜</title>
  <style>
    :root { color-scheme: light; --ink:#172033; --muted:#71809a; --line:#e6ebf2; --bg:#f4f7fb; --card:#fff; --accent:#159b72; --accent-soft:#dcf6ec; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:"PingFang SC","Microsoft YaHei",sans-serif; color:var(--ink); background:var(--bg); }
    main { width:min(780px,calc(100% - 24px)); margin:24px auto 48px; }
    .hero { padding:22px; background:var(--card); border:1px solid var(--line); border-radius:8px; }
    h1 { margin:0; font-size:23px; } .sub { margin:8px 0 0; color:var(--muted); font-size:14px; }
    .filters { display:grid; grid-template-columns:1.3fr 1fr 1fr auto auto; gap:10px; margin-top:18px; }
    select,input,button { min-height:40px; border:1px solid #ced7e4; border-radius:6px; padding:0 11px; font:inherit; color:var(--ink); background:#fff; }
    button { cursor:pointer; background:#157b5d; border-color:#157b5d; color:#fff; font-weight:600; }
    .summary { display:grid; grid-template-columns:repeat(5,1fr); gap:10px; margin:16px 0; }
    .metric { padding:14px; background:var(--card); border:1px solid var(--line); border-radius:7px; } .metric small { display:block; color:var(--muted); } .metric strong { display:block; margin-top:6px; font-size:21px; }
    .panel { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:18px; }
    .panel h2 { margin:0 0 10px; font-size:17px; } .status { color:var(--muted); font-size:14px; min-height:21px; }
    .row { display:grid; grid-template-columns:62px 1fr 72px; align-items:center; gap:12px; padding:13px 0; border-bottom:1px solid #eef1f5; }
    .row:last-child { border-bottom:0; } .second { font-weight:700; font-variant-numeric:tabular-nums; }
    .track { height:9px; overflow:hidden; border-radius:999px; background:#edf1f5; } .fill { height:100%; border-radius:inherit; background:var(--accent); }
    .meta { margin-top:5px; color:var(--muted); font-size:12px; } .count { text-align:right; font-size:17px; font-weight:700; } .count small { display:block; color:var(--muted); font-size:12px; font-weight:400; }
    .empty { padding:32px 0; color:var(--muted); text-align:center; }
    @media (max-width:600px) { main { margin-top:12px; } .filters { grid-template-columns:1fr 1fr; } .filters button { grid-column:span 2; } .summary { grid-template-columns:1fr 1fr; } .metric:last-child { grid-column:span 2; } }
  </style>
</head>
<body>
  <main>
    <section class="hero">
      <h1>接单时间排行榜</h1>
      <p class="sub">{% if admin_preview %}来源 1 与来源 2 秒桶合并数据，按北京时间展示。{% else %}按北京时间展示接单时间分布。{% endif %}</p>
      <div class="filters">
        <select id="merchant"><option>加载中</option></select>
        <input id="date" type="date" value="{{ record_date }}">
        <select id="slot"><option>请选择场次</option></select>
        <button id="reload" type="button">查询</button>
        <button id="refreshData" type="button">刷新数据</button>
        <button id="openOrderQuery" type="button">查询接单时间</button>
      </div>
    </section>
    <section class="summary">
      <div class="metric"><small>商家名称</small><strong id="merchantName">--</strong></div>
      <div class="metric"><small>每场数量</small><strong id="quantityPerSlot">--</strong></div>
      <div class="metric"><small>最高免单</small><strong id="maxDiscount">--</strong></div>
      <div class="metric"><small>参与人数</small><strong id="total">--</strong></div>
      <div class="metric"><small>最后更新时间</small><strong id="updated">--</strong></div>
    </section>
    <section class="panel">
      <h2>秒数分布</h2>
      <div id="status" class="status">正在读取活动目录</div>
      <div id="list"></div>
    </section>
  </main>
  <script>
    const adminPreview = {{ 'true' if admin_preview else 'false' }};
    const merchant = document.getElementById('merchant'); const slot = document.getElementById('slot'); const date = document.getElementById('date');
    const statusNode = document.getElementById('status'); const list = document.getElementById('list'); let activities = [];
    const escapeHtml = value => String(value ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    function formatTime(value) { if(!value) return '--'; return new Date(Number(value) * 1000).toLocaleString('zh-CN',{hour12:false}); }
    async function loadCatalog() {
      statusNode.textContent = '正在读取活动目录'; list.innerHTML = '';
      const response = await fetch('/api/order-rankings/v2/catalog?date=' + encodeURIComponent(date.value)); const payload = await response.json();
      activities = payload.activities || []; const merchants = [...new Map(activities.map(item => [item.merchant_name,item])).values()];
      merchant.innerHTML = merchants.length ? merchants.map(item => `<option value="${escapeHtml(item.merchant_name)}">${escapeHtml(item.merchant_name)}</option>`).join('') : '<option value="">暂无活动</option>';
      fillSlots(); if(activities.length) await loadRanking(); else statusNode.textContent = '当天暂无可用活动';
    }
    function fillSlots() { const values = activities.filter(item => item.merchant_name === merchant.value); slot.innerHTML = values.length ? values.map(item => `<option value="${escapeHtml(item.slot_time)}">${escapeHtml(item.slot_time)}</option>`).join('') : '<option value="">暂无场次</option>'; }
    async function loadRanking() {
      const item = activities.find(value => value.merchant_name === merchant.value && value.slot_time === slot.value); if(!item) return;
      statusNode.textContent = '正在读取最新合并数据'; list.innerHTML = '';
      const response = await fetch('/api/order-rankings/v2/query?activity_id=' + encodeURIComponent(item.id)); const payload = await response.json();
      if(!response.ok || !payload.success) { statusNode.textContent = payload.error || '暂时无法读取排行榜'; return; }
      const activity = payload.activity || {}; const buckets = payload.buckets || []; const total = Number(payload.total || 0);
      document.getElementById('merchantName').textContent = activity.merchant_name || '--';
      document.getElementById('quantityPerSlot').textContent = Number(activity.quantity_per_slot || 0) ? Number(activity.quantity_per_slot) + ' 份' : '--';
      document.getElementById('maxDiscount').textContent = activity.max_discount ? activity.max_discount + ' 元' : '--';
      document.getElementById('total').textContent = total ? total + ' 人' : '--'; document.getElementById('updated').textContent = formatTime(payload.last_updated_at);
      statusNode.textContent = buckets.length ? ('当前展示 ' + buckets.length + ' 个秒桶' + (adminPreview ? '，来源 2 匹配状态：' + ((payload.source2_match || {}).status || 'pending') : '')) : '正在采集或当前暂无秒桶数据';
      list.innerHTML = buckets.length ? buckets.map(item => { const pct = Number(item.ratio || 0) * 100; const sourceDetail = adminPreview ? '<small>源1 ' + item.source1_count + ' + 源2 ' + item.source2_count + '</small>' : ''; return `<div class="row"><div class="second">${String(item.bucket_second).padStart(2,'0')}s</div><div><div class="track"><div class="fill" style="width:${Math.max(0,Math.min(100,pct))}%"></div></div><div class="meta">累计 ${item.cumulative_count} 人，占比 ${pct.toFixed(1)}%</div></div><div class="count">${item.merged_count} 人${sourceDetail}</div></div>`; }).join('') : '<div class="empty">暂无数据</div>';
    }
    merchant.addEventListener('change', () => { fillSlots(); loadRanking(); }); slot.addEventListener('change', loadRanking); date.addEventListener('change', loadCatalog); document.getElementById('reload').addEventListener('click', loadRanking); document.getElementById('refreshData').addEventListener('click', loadRanking); document.getElementById('openOrderQuery').addEventListener('click', () => { window.location.href = '/web/query'; }); loadCatalog().catch(error => statusNode.textContent = error.message || '读取失败');
  </script>
</body>
</html>
