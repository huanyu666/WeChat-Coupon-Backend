<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>美团订单助手</title>
    
    <!-- 引入霞鹜文楷 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-screen-web/style.css">
    <!-- Three.js -->
    <script src="https://cdn.bootcdn.net/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        :root {
            --bg-color: #0f1014;
            --ink-color: #e0e0e0;
            --accent-cyan: #00f2ff;
            --accent-pink: #ff0055;
            --accent-yellow: #f1c40f;
            --paper-line: rgba(255, 255, 255, 0.05);
            --terminal-green: #4af626;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            cursor: none; /* 使用自定义光标 */
        }

        body {
            font-family: "LXGW WenKai Screen", monospace;
            background-color: var(--bg-color);
            color: var(--ink-color);
            overflow-x: hidden;
            min-height: 100vh;
            position: relative;
        }

        /* ================= SVG 抖动滤镜 (手绘灵魂) ================= */
        .svg-filters { position: absolute; width: 0; height: 0; pointer-events: none; }

        /* 通用抖动边框类 */
        .sketchy-border {
            position: relative;
            border: 2px solid var(--ink-color);
            border-radius: 4px;
            filter: url(#squiggly-0); 
            background: rgba(15, 16, 20, 0.85);
            box-shadow: 5px 5px 0px rgba(0, 242, 255, 0.1);
            transition: transform 0.2s;
        }

        .sketchy-border:hover {
            transform: translate(-2px, -2px);
            box-shadow: 7px 7px 0px var(--accent-cyan);
            filter: url(#squiggly-1);
        }

        /* ================= 背景层 ================= */
        #bg-canvas {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            opacity: 0.6;
        }
        #fx-canvas {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 999;
        }

        /* ================= 自定义光标 ================= */
        #cursor {
            position: fixed; top: 0; left: 0;
            width: 20px; height: 20px;
            border: 2px solid var(--accent-cyan);
            border-radius: 50%;
            pointer-events: none; z-index: 9999;
            transform: translate(-50%, -50%);
            transition: width 0.2s, height 0.2s, border-color 0.2s;
            mix-blend-mode: difference;
        }
        #cursor.hovered {
            width: 50px; height: 50px;
            background: rgba(0, 242, 255, 0.1);
            border-color: var(--accent-pink);
            border-style: dashed;
        }

        /* ================= UI 容器 ================= */
        .container {
            position: relative;
            max-width: 550px;
            margin: 8vh auto 40px;
            padding: 40px;
            z-index: 10;
        }

        /* 装饰性角落标记 */
        .corner-mark {
            position: absolute; width: 15px; height: 15px;
            border: 2px solid var(--accent-pink);
            transition: all 0.3s;
        }
        .tl { top: -4px; left: -4px; border-right: none; border-bottom: none; }
        .tr { top: -4px; right: -4px; border-left: none; border-bottom: none; }
        .bl { bottom: -4px; left: -4px; border-right: none; border-top: none; }
        .br { bottom: -4px; right: -4px; border-left: none; border-top: none; }

        .title {
            font-size: 32px;
            text-align: center;
            margin-bottom: 40px;
            font-weight: 900;
            letter-spacing: 2px;
            color: var(--accent-cyan);
            text-shadow: 2px 2px 0px var(--accent-pink);
            position: relative;
            cursor: help;
        }
        
        .title::after {
            content: ''; display: block; width: 100%; height: 5px;
            background: repeating-linear-gradient(45deg, var(--accent-cyan), var(--accent-cyan) 10px, transparent 10px, transparent 20px);
            margin-top: 10px;
            filter: url(#squiggly-1);
        }

        .form-group { margin-bottom: 30px; position: relative; }

        .form-label {
            display: flex; justify-content: space-between;
            font-size: 14px; margin-bottom: 8px;
            color: var(--accent-cyan);
            font-weight: bold;
        }
        .form-label::before { content: ">> "; color: var(--accent-pink); margin-right: 5px; }

        .form-input, .form-textarea {
            width: 100%; padding: 15px;
            font-family: "LXGW WenKai Screen", monospace;
            font-size: 16px; color: #fff;
            background: transparent;
            border: none; border-bottom: 2px solid #555;
            outline: none; transition: all 0.3s;
            background-image: linear-gradient(transparent 95%, var(--paper-line) 95%);
            background-size: 100% 30px; line-height: 30px;
        }
        .form-input:focus, .form-textarea:focus { border-bottom-color: var(--accent-cyan); }
        .form-textarea { min-height: 120px; resize: vertical; }

        /* ================= 按钮组 ================= */
        .btn-group { display: flex; gap: 20px; margin-top: 40px; }

        .btn {
            flex: 1; padding: 18px;
            background: transparent;
            color: var(--ink-color);
            font-family: inherit; font-size: 18px; font-weight: bold;
            border: 2px solid var(--ink-color);
            position: relative; overflow: hidden;
            filter: url(#squiggly-0);
            transition: all 0.1s;
        }
        .btn::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--accent-cyan);
            z-index: -1; transform: translateX(-101%);
            transition: transform 0.3s ease;
        }
        .btn:hover::before { transform: translateX(0); }
        .btn:hover { color: #000; filter: url(#squiggly-1); border-color: #000; }
        .btn:active { transform: scale(0.95); }

        .btn-primary { border-color: var(--accent-cyan); }
        .btn-secondary { border-style: dashed; opacity: 0.8; }
        .btn-secondary:hover::before { background: var(--accent-pink); }

        /* ================= 历史记录 ================= */
        .history-section {
            margin-top: 50px; border-top: 2px dashed #333;
            padding-top: 20px; font-size: 14px;
        }
        .history-header { display: flex; justify-content: space-between; margin-bottom: 15px; color: #666; }
        .history-item {
            padding: 10px; margin-bottom: 5px;
            border-left: 2px solid transparent;
            display: flex; justify-content: space-between;
            transition: 0.2s; opacity: 0.7; cursor: pointer;
        }
        .history-item:hover {
            opacity: 1; border-left-color: var(--accent-cyan);
            background: rgba(255, 255, 255, 0.05); padding-left: 15px;
        }
        
        /* ================= 加载动画 & 模态框 ================= */
        #loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 16, 20, 0.95);
            z-index: 2000;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        #loading-overlay.active { opacity: 1; pointer-events: auto; }
        
        .loader-box {
            width: 250px; height: 12px;
            border: 2px solid var(--accent-cyan); border-radius: 10px;
            overflow: hidden; position: relative;
            filter: url(#squiggly-0);
        }
        .loader-bar {
            height: 100%;
            background: repeating-linear-gradient(45deg, var(--accent-cyan), var(--accent-cyan) 10px, var(--accent-pink) 10px, var(--accent-pink) 20px);
            width: 0%; transition: width 0.1s;
        }

        /* 模态框 (代替 Alert) */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(5px);
            z-index: 1000;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: 0.3s;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }

        .modal-content {
            width: 85%; max-width: 480px;
            background: #151515; color: #fff;
            box-shadow: 20px 20px 0 rgba(0,0,0,0.5);
            transform: scale(0.8) rotate(-2deg);
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 2px solid #fff;
            filter: url(#squiggly-0);
            display: flex; flex-direction: column;
        }
        .modal-overlay.active .modal-content { transform: scale(1) rotate(0deg); }

        /* 模态框头部状态颜色 */
        .modal-content.type-info { border-color: var(--accent-cyan); }
        .modal-content.type-info .modal-header { background: var(--accent-cyan); color: #000; }
        
        .modal-content.type-error { border-color: var(--accent-pink); }
        .modal-content.type-error .modal-header { background: var(--accent-pink); color: #fff; }

        .modal-content.type-success { border-color: var(--terminal-green); }
        .modal-content.type-success .modal-header { background: var(--terminal-green); color: #000; }

        .modal-header {
            padding: 15px; font-weight: bold; font-size: 20px;
            text-align: center; letter-spacing: 2px;
        }
        .modal-body { padding: 25px; max-height: 60vh; overflow-y: auto; font-size: 16px; line-height: 1.6; }

        .result-card {
            border: 1px solid #444; padding: 15px; margin-bottom: 15px;
            background: linear-gradient(90deg, rgba(255,255,255,0.03) 0%, transparent 100%);
        }
        .result-card.success { border-left: 5px solid var(--terminal-green); }
        .result-card.fail { border-left: 5px solid var(--accent-pink); }

        .close-btn {
            width: 100%; padding: 15px; background: transparent;
            color: #fff; border: none; border-top: 1px solid #333;
            font-family: inherit; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        .close-btn:hover { background: #222; color: var(--accent-cyan); }

    </style>
</head>
<body>

    <!-- SVG 滤镜 (提供手绘抖动效果) -->
    <svg class="svg-filters">
        <defs>
            <filter id="squiggly-0">
                <feTurbulence id="turbulence-0" baseFrequency="0.02" numOctaves="3" result="noise" seed="0"/>
                <feDisplacementMap id="displacement-0" in="SourceGraphic" in2="noise" scale="2" />
            </filter>
            <filter id="squiggly-1">
                <feTurbulence id="turbulence-1" baseFrequency="0.02" numOctaves="3" result="noise" seed="1"/>
                <feDisplacementMap id="displacement-1" in="SourceGraphic" in2="noise" scale="3" />
            </filter>
        </defs>
    </svg>

    <!-- 3D & 2D 画布背景 -->
    <canvas id="bg-canvas"></canvas>
    <canvas id="fx-canvas"></canvas>
    <div id="cursor"></div>

    <!-- 加载界面 -->
    <div id="loading-overlay">
        <div style="color: var(--accent-cyan); font-size: 24px; margin-bottom: 20px; font-weight: bold;">
            数据链路同步中
        </div>
        <div class="loader-box">
            <div class="loader-bar" id="loaderBar"></div>
        </div>
        <div style="margin-top: 15px; font-family: monospace; color: #888;" id="loadingText">初始化网络协议...</div>
    </div>

    <!-- 主界面 -->
    <div class="container sketchy-border">
        <div class="corner-mark tl"></div><div class="corner-mark tr"></div>
        <div class="corner-mark bl"></div><div class="corner-mark br"></div>

        <h1 class="title" data-value="美团订单查询系统">美团订单查询系统</h1>

        <div class="form-group">
            <label class="form-label">
                <span>美团 Token 链接</span>
            </label>
            <input type="text" class="form-input" id="urlInput" placeholder="粘贴 i.meituan.com 完整链接..." autocomplete="off">
        </div>

        <div class="form-group">
            <label class="form-label">
                <span>订单号码列表</span>
            </label>
            <textarea class="form-textarea" id="orderIdInput" placeholder="输入订单ID (支持批量换行或逗号)&#10;例如: 123456789012345"></textarea>
        </div>

        <div class="btn-group">
            <button class="btn btn-primary" id="queryBtn">执行查询指令</button>
            <button class="btn btn-secondary" id="clearBtn">重置系统</button>
        </div>

        <div class="history-section">
            <div class="history-header">
                <span>[ 历史日志 ]</span>
                <span id="clearHistoryBtn" style="cursor:pointer; color:var(--accent-pink);">[ 清空数据 ]</span>
            </div>
            <div id="historyList"></div>
        </div>
    </div>

    <div class="modal-overlay" id="universalModal">
        <div class="modal-content type-info" id="modalContentBox">
            <div class="modal-header" id="modalHeader">系统提示</div>
            <div class="modal-body" id="modalBody"></div>
            <button class="close-btn" onclick="closeModal()">[ 关闭终端窗口 ]</button>
        </div>
    </div>
