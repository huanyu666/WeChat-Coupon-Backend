
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SBTI 人格测试</title>
  <style>
    :root {
      --bg: #f6faf6;
      --panel: #ffffff;
      --text: #1e2a22;
      --muted: #6a786f;
      --line: #dbe8dd;
      --soft: #edf6ef;
      --accent: #6c8d71;
      --accent-strong: #4d6a53;
      --shadow: 0 16px 40px rgba(47, 73, 55, 0.08);
      --radius: 22px;
      --shell-pad-x: 16px;
      --shell-pad-top: 24px;
      --shell-pad-bottom: 56px;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at top left, #f8fff8 0, #f6faf6 36%, #f2f7f3 100%);
      color: var(--text);
      min-height: 100vh;
    }

    .shell {
      max-width: 980px;
      margin: 0 auto;
      padding: var(--shell-pad-top) var(--shell-pad-x) var(--shell-pad-bottom);
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .hero {
      padding: 28px;
      margin-top: 20px;
      overflow: hidden;
      position: relative;
    }

    .hero::after {
      content: "";
      position: absolute;
      right: -60px;
      top: -60px;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: linear-gradient(180deg, rgba(127, 165, 134, 0.18), rgba(127, 165, 134, 0.02));
      pointer-events: none;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--accent-strong);
      border: 1px solid var(--line);
      background: var(--soft);
      border-radius: 999px;
      padding: 8px 12px;
      margin-bottom: 16px;
    }

    h1, h2, h3, p { margin: 0; }
    .hero h1 {
      font-size: clamp(28px, 5vw, 52px);
      line-height: 1.08;
      letter-spacing: -0.03em;
      max-width: 680px;
    }
    .hero .sub {
      margin-top: 14px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.75;
      max-width: 720px;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.3fr 0.9fr;
      gap: 18px;
      align-items: stretch;
      margin-top: 24px;
    }

    .mini-panel {
      padding: 18px;
      border-radius: 18px;
      border: 1px solid var(--line);
      background: linear-gradient(180deg, #fbfefb, #f3f8f4);
    }

    .mini-panel h3 {
      font-size: 15px;
      margin-bottom: 10px;
    }

    .mini-panel ul {
      margin: 0;
      padding-left: 18px;
      color: var(--muted);
      line-height: 1.8;
      font-size: 14px;
    }

        .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 22px;
    }
    .hero-minimal {
      min-height: 48vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 42px 20px;
    }
    .hero-minimal::after { display: none; }
    .hero-minimal h1 {
      max-width: none;
      margin: 0;
    }
    .hero-actions-single {
      justify-content: center;
      margin-top: 28px;
    }

    #intro {
      width: 100vw;
      margin-left: calc(50% - 50vw);
      margin-right: calc(50% - 50vw);
      margin-top: calc(-1 * var(--shell-pad-top));
      margin-bottom: calc(-1 * var(--shell-pad-bottom));
      min-height: calc(100svh + var(--shell-pad-top) + var(--shell-pad-bottom));
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(1200px 500px at 78% -10%, rgba(119, 157, 127, 0.38), transparent 65%),
        radial-gradient(840px 440px at 10% 110%, rgba(91, 122, 98, 0.32), transparent 68%),
        linear-gradient(120deg, #0f1612 0%, #1f2f26 56%, #2d4033 100%);
      color: #edf4ef;
    }

    #intro::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.06) 1px, transparent 1px);
      background-size: 72px 72px;
      opacity: 0.2;
      pointer-events: none;
    }

    #intro::after {
      content: "";
      position: absolute;
      right: -140px;
      top: -160px;
      width: 520px;
      height: 520px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, rgba(190, 220, 194, 0.32), rgba(190, 220, 194, 0.04) 62%, rgba(190, 220, 194, 0) 76%);
      filter: blur(2px);
      pointer-events: none;
      animation: introFloat 9s ease-in-out infinite;
    }

    .intro-hero {
      min-height: 100svh;
      display: flex;
      align-items: center;
      padding: clamp(56px, 10vw, 112px) 0;
      position: relative;
      z-index: 1;
    }

    .intro-inner {
      width: min(760px, calc(100% - 56px));
      margin: 0 auto;
    }

    .intro-brand {
      margin: 0;
      font-size: 12px;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: rgba(237, 244, 239, 0.82);
      animation: introRise 0.58s ease-out both;
    }

    .intro-official {
      position: relative;
      margin-top: 14px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid rgba(217, 183, 112, 0.72);
      background:
        radial-gradient(circle at 16% 20%, rgba(208, 170, 95, 0.24), rgba(208, 170, 95, 0) 42%),
        linear-gradient(140deg, rgba(22, 18, 13, 0.94) 0%, rgba(12, 10, 7, 0.96) 56%, rgba(26, 20, 13, 0.9) 100%);
      color: #f0d8a9;
      box-shadow:
        inset 0 1px 0 rgba(255, 241, 207, 0.15),
        inset 0 -1px 0 rgba(130, 95, 45, 0.38),
        0 12px 32px rgba(7, 6, 4, 0.36);
      backdrop-filter: blur(8px);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.055em;
      white-space: nowrap;
      overflow: hidden;
      animation: introRise 0.66s ease-out 0.05s both;
    }

    .intro-official-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: radial-gradient(circle at 38% 32%, #ffe6b8 0%, #c79b52 62%, #8b652f 100%);
      box-shadow: 0 0 0 4px rgba(212, 167, 94, 0.22);
      flex: none;
    }

    .intro-official::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(104deg, rgba(255, 245, 223, 0) 16%, rgba(255, 223, 158, 0.4) 48%, rgba(255, 245, 223, 0) 76%);
      transform: translateX(-135%);
      animation: introSheen 6.4s ease-in-out 1.1s infinite;
      pointer-events: none;
    }

    .intro-title {
      margin: 18px 0 0;
      max-width: 12ch;
      font-size: clamp(46px, 9vw, 92px);
      line-height: 0.96;
      letter-spacing: -0.045em;
      color: #f7fcf8;
      text-wrap: balance;
      animation: introRise 0.7s ease-out 0.08s both;
    }

    .intro-title span {
      color: #b9d6bf;
    }

    .intro-sub {
      margin: 20px 0 0;
      max-width: 32ch;
      font-size: clamp(15px, 2.3vw, 20px);
      line-height: 1.65;
      color: rgba(236, 244, 238, 0.82);
      animation: introRise 0.72s ease-out 0.16s both;
    }

    .intro-actions {
      margin-top: 30px;
      animation: introRise 0.72s ease-out 0.24s both;
    }

    #intro .intro-actions {
      flex-wrap: nowrap;
      align-items: center;
    }

    .intro-cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 54px;
      padding: 14px 28px;
      border-radius: 999px;
      border: 1px solid rgba(229, 241, 232, 0.28);
      background: linear-gradient(180deg, #d4e8d8 0%, #a7c4ad 100%);
      color: #162219;
      box-shadow: 0 16px 36px rgba(11, 20, 14, 0.36);
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    .intro-cta:hover {
      transform: translateY(-2px);
      box-shadow: 0 22px 44px rgba(8, 16, 11, 0.42);
      background: linear-gradient(180deg, #def0e2 0%, #b9d3be 100%);
    }

    #intro .intro-share {
      border-radius: 999px;
      border: 1px solid rgba(237, 245, 239, 0.38);
      background: rgba(243, 250, 245, 0.08);
      color: #eaf4ed;
      backdrop-filter: blur(6px);
      box-shadow: none;
    }

    #intro .intro-share:hover {
      background: rgba(243, 250, 245, 0.18);
      border-color: rgba(237, 245, 239, 0.56);
      transform: translateY(-2px);
    }

    #intro .intro-copy {
      border-radius: 999px;
      border: 1px solid rgba(222, 230, 224, 0.34);
      background: rgba(237, 245, 239, 0.05);
      color: #d9e5dc;
      backdrop-filter: blur(6px);
      box-shadow: none;
    }

    #intro .intro-copy:hover {
      background: rgba(237, 245, 239, 0.14);
      border-color: rgba(230, 237, 232, 0.52);
      transform: translateY(-2px);
    }

    @keyframes introRise {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes introFloat {
      0%,
      100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(14px) scale(1.03); }
    }

    @keyframes introSheen {
      0%, 74%, 100% { transform: translateX(-135%); }
      82%, 90% { transform: translateX(132%); }
    }

    @keyframes testSurfaceIn {
      from {
        opacity: 0;
        transform: translateY(14px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    button {
      border: 0;
      cursor: pointer;
      transition: transform .16s ease, box-shadow .16s ease, opacity .16s ease;
      font: inherit;
    }

    button:hover { transform: translateY(-1px); }
    button:disabled { cursor: not-allowed; opacity: 0.55; transform: none; }

    .btn-primary {
      background: var(--accent-strong);
      color: #fff;
      padding: 14px 20px;
      border-radius: 14px;
      box-shadow: 0 12px 30px rgba(77, 106, 83, 0.18);
      font-weight: 700;
    }

    .btn-secondary {
      background: #fff;
      color: var(--accent-strong);
      padding: 14px 20px;
      border-radius: 14px;
      border: 1px solid var(--line);
      font-weight: 700;
    }

    .screen { display: none; }
    .screen.active { display: block; }

    .test-wrap,
    .result-wrap {
      margin-top: 22px;
      padding: 22px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .progress {
      flex: 1;
      min-width: 240px;
      height: 10px;
      background: #edf3ee;
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }

    .progress > span {
      display: block;
      width: 0;
      height: 100%;
      background: linear-gradient(90deg, #97b59c, #5b7a62);
      border-radius: inherit;
      transition: width .22s ease;
    }

    .progress-text {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .question-list {
      display: grid;
      gap: 16px;
    }

    .question {
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px;
      background: linear-gradient(180deg, #ffffff, #fbfdfb);
    }

    .question-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 12px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 999px;
      padding: 6px 10px;
      background: var(--soft);
      border: 1px solid var(--line);
    }

    .question-title {
      font-size: 16px;
      line-height: 1.7;
      white-space: pre-wrap;
    }

    .options {
      display: grid;
      gap: 10px;
      margin-top: 14px;
    }

    .option {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px 14px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: #fff;
      transition: border-color .16s ease, background .16s ease, transform .16s ease;
    }

    .option:hover {
      border-color: #bcd0c1;
      background: #f8fcf9;
    }

    .option input {
      margin-top: 3px;
      accent-color: var(--accent-strong);
      transform: scale(1.1);
      flex-shrink: 0;
    }

    .option-code {
      font-weight: 800;
      color: var(--accent-strong);
      min-width: 22px;
    }

    .actions-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 18px;
      padding-top: 6px;
    }

    .hint {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    .result-hero {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 18px;
      align-items: stretch;
    }

    .type-box,
    .score-box,
    .dim-box,
    .top3-box,
    .about-box {
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px;
      background: linear-gradient(180deg, #ffffff, #fbfdfb);
    }

    .type-kicker {
      font-size: 12px;
      color: var(--accent-strong);
      margin-bottom: 8px;
      letter-spacing: .05em;
    }

    .type-name {
      font-size: clamp(30px, 5vw, 48px);
      line-height: 1.08;
      letter-spacing: -0.03em;
    }

    .type-subname {
      margin-top: 8px;
      color: var(--muted);
      font-size: 15px;
    }

    .match {
      margin-top: 18px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border-radius: 999px;
      padding: 10px 14px;
      background: var(--soft);
      border: 1px solid var(--line);
      color: var(--accent-strong);
      font-weight: 700;
    }

    .type-desc {
      margin-top: 18px;
      line-height: 1.85;
      font-size: 15px;
      color: #304034;
    }

    .score-box h3,
    .dim-box h3,
    .top3-box h3,
    .about-box h3 {
      font-size: 16px;
      margin-bottom: 12px;
    }

    .score-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .score-item {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px;
      background: #fff;
    }

    .score-item .k {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .score-item .v {
      font-size: 20px;
      font-weight: 800;
      color: var(--accent-strong);
    }

    .dim-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .dim-pill {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px;
      background: #fff;
    }

    .dim-pill .label {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 6px;
    }

    .dim-pill .value {
      font-size: 20px;
      font-weight: 800;
      color: var(--accent-strong);
    }

    .top3-list {
      display: grid;
      gap: 10px;
    }

    .top3-item {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px;
      background: #fff;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
    }

    .top3-item strong {
      display: block;
      margin-bottom: 4px;
    }

    .top3-item span {
      color: var(--muted);
      font-size: 13px;
    }

    .top3-score {
      color: var(--accent-strong);
      font-weight: 800;
      white-space: nowrap;
    }

    .about-box p {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.8;
    }

    .footer-note {
      margin-top: 16px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
    }

    
    .result-layout {
      display: grid;
      gap: 18px;
    }
    .result-top {
      display: grid;
      grid-template-columns: 0.9fr 1.1fr;
      gap: 18px;
      align-items: stretch;
    }
    .poster-box, .type-box, .analysis-box, .dim-box, .note-box {
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px;
      background: linear-gradient(180deg, #ffffff, #fbfdfb);
    }
        .poster-box {
      display: grid;
      grid-template-rows: 1fr auto;
      min-height: 280px;
      overflow: hidden;
      position: relative;
      background:
        radial-gradient(circle at top right, rgba(127,165,134,0.16), rgba(127,165,134,0) 40%),
        linear-gradient(180deg, #ffffff, #f7fbf8);
    }
    .poster-box::after {
      content: "";
      position: absolute;
      right: -46px;
      bottom: -46px;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: linear-gradient(180deg, rgba(127,165,134,0.12), rgba(127,165,134,0.01));
      pointer-events: none;
    }
    .poster-image {
      width: 100%;
      min-height: 220px;
      max-height: 460px;
      object-fit: contain;
      border-radius: 18px;
      background: rgba(255,255,255,0.75);
      position: relative;
      z-index: 1;
    }
    .poster-box.no-image .poster-image {
      display: none;
    }
    .poster-caption {
      margin-top: 14px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.8;
      position: relative;
      z-index: 1;
    }
    .type-kicker {
      font-size: 12px;
      color: var(--accent-strong);
      margin-bottom: 8px;
      letter-spacing: .06em;
    }
    .type-name {
      font-size: clamp(30px, 5vw, 48px);
      line-height: 1.08;
      letter-spacing: -0.03em;
    }
    .type-subname {
      margin-top: 10px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.8;
    }
    .match {
      margin-top: 18px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border-radius: 999px;
      padding: 10px 14px;
      background: var(--soft);
      border: 1px solid var(--line);
      color: var(--accent-strong);
      font-weight: 700;
      font-size: 14px;
      line-height: 1.4;
    }
    .analysis-box h3, .dim-box h3, .note-box h3 {
      font-size: 16px;
      margin-bottom: 12px;
    }
    .result-actions {
      margin-top: 22px;
      display: flex;
      justify-content: flex-end;
    }
    .analysis-box p {
      margin: 0;
      color: #304034;
      font-size: 15px;
      line-height: 1.9;
      white-space: pre-wrap;
    }
    .dim-list {
      display: grid;
      gap: 12px;
    }
    .dim-item {
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
      background: #fff;
    }
    .dim-item-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    .dim-item-name {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
    }
    .dim-item-score {
      color: var(--accent-strong);
      font-weight: 800;
      font-size: 14px;
      white-space: nowrap;
    }
    .dim-item p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.8;
    }
    .note-box p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.8;
    }

    .author-box {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: linear-gradient(180deg, #ffffff, #fbfdfb);
      overflow: hidden;
    }
    .author-box summary {
      list-style: none;
      cursor: pointer;
      padding: 18px;
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .author-box summary::-webkit-details-marker { display: none; }
    .author-box summary::after {
      content: '展开';
      font-size: 12px;
      font-weight: 700;
      color: var(--accent-strong);
      border: 1px solid var(--line);
      background: var(--soft);
      padding: 6px 10px;
      border-radius: 999px;
      flex-shrink: 0;
    }
    .author-box[open] summary::after {
      content: '收起';
    }
    .author-content {
      border-top: 1px solid var(--line);
      padding: 0 18px 18px;
    }
    .author-content p {
      margin: 14px 0 0;
      color: #304034;
      font-size: 14px;
      line-height: 1.9;
    }

    .result-actions {
      display: flex;

    function showScreen(name) {

        el.classList.toggle('active', key === name);
      });
      window.scrollTo({ top: 0, behavior: 'smooth' });

    function roundedRectPath(ctx, x, y, w, h, r) {
      const radius = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.arcTo(x + w, y, x + w, y + h, radius);
      ctx.arcTo(x + w, y + h, x, y + h, radius);
      ctx.arcTo(x, y + h, x, y, radius);
      ctx.arcTo(x, y, x + w, y, radius);
      ctx.closePath();
    }

    function loadImage(url) {
      return new Promise((resolve, reject) => {
        const src = String(url || '').trim();
        if (!src) {
          reject(new Error('图片地址为空'));
          return;
        }

        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error(`图片加载失败: ${src}`));

        try {
          const resolved = new URL(src, window.location.href);
          const isCrossOrigin = resolved.origin !== window.location.origin;
          if (isCrossOrigin && /^https?:$/i.test(resolved.protocol)) {
            img.crossOrigin = 'anonymous';
            img.referrerPolicy = 'no-referrer';
          }
          img.src = resolved.toString();
        } catch (err) {
          img.src = src;
        }
      });
    }

    function resetPosterObjectURL() {
      if (!currentPosterObjectURL) return;
      URL.revokeObjectURL(currentPosterObjectURL);
      currentPosterObjectURL = '';
    }

    function closePosterModal() {
      if (!posterModal) return;
      posterModal.classList.remove('active');
      posterModal.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
      if (posterPreviewImage) posterPreviewImage.removeAttribute('src');
      resetPosterObjectURL();
    }

    function openPosterModal(blob, fileName = 'sbti-share-poster.png') {
      if (!posterModal || !posterPreviewImage) return;
      resetPosterObjectURL();
      currentPosterObjectURL = URL.createObjectURL(blob);
      currentPosterFileName = fileName;
      posterPreviewImage.src = currentPosterObjectURL;
      posterModal.classList.add('active');
      posterModal.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
    }

    function savePosterImage() {
      if (!currentPosterObjectURL) return;
      const ua = navigator.userAgent || '';
      const isWeChat = /MicroMessenger/i.test(ua);
      const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(ua);

      if (isWeChat || isMobile) {
        alert('请长按上方海报图片，然后选择“保存到相册”。');
        return;
      }

      const link = document.createElement('a');
      link.href = currentPosterObjectURL;
      link.download = currentPosterFileName;
      document.body.appendChild(link);
      link.click();
      link.remove();
    }

    async function copyShareLink() {

        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
        } else {
          const textarea = document.createElement('textarea');
          textarea.value = text;
          textarea.setAttribute('readonly', 'readonly');
          textarea.style.position = 'fixed';
          textarea.style.opacity = '0';
          textarea.style.pointerEvents = 'none';
          textarea.style.left = '-9999px';
          document.body.appendChild(textarea);
          textarea.select();
          textarea.setSelectionRange(0, textarea.value.length);
          const copied = document.execCommand('copy');
          textarea.remove();
          if (!copied) {
            throw new Error('复制失败');
          }
        }

        copyShareLinkBtn.textContent = '复制成功';

    async function loadQrImage(url) {
      const encoded = encodeURIComponent(url);
      // 完全依赖在线 API 实时生成正确的二维码
      const candidates = [
        `https://quickchart.io/qr?text=${encoded}&size=420&margin=1&ecLevel=M&format=png`,
        `https://api.qrserver.com/v1/create-qr-code/?size=420x420&margin=0&data=${encoded}`
      ];
      let lastError = null;
      for (const src of candidates) {
        try {
          return await loadImage(src);
        } catch (err) {
          lastError = err;
        }
      }
      throw lastError || new Error('二维码加载失败');
    }

    function canvasToBlob(canvas) {
      return new Promise((resolve, reject) => {
        if (typeof canvas.toBlob !== 'function') {
          try {
            const dataURL = canvas.toDataURL('image/png', 1);
            const binary = atob(dataURL.split(',')[1]);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) {
              bytes[i] = binary.charCodeAt(i);
            }
            resolve(new Blob([bytes], { type: 'image/png' }));
          } catch (error) {
            reject(error);
          }
          return;
        }
        canvas.toBlob((blob) => {
          if (blob) resolve(blob);
          else reject(new Error('Canvas to Blob failed'));
        }, 'image/png', 1);
      });
    }

      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function updateProgress() {
      const visibleQuestions = getVisibleQuestions();
      const total = visibleQuestions.length;
      const done = visibleQuestions.filter(q => app.answers[q.id] !== undefined).length;
      const percent = total ? (done / total) * 100 : 0;
      progressBar.style.width = `${percent}%`;
      progressText.textContent = `${done} / ${total}`;
      const complete = done === total && total > 0;
      submitBtn.disabled = !complete;
      testHint.textContent = complete
        ? '都做完了。现在可以把你的电子魂魄交给结果页审判。'
        : '全选完才会放行。世界已经够乱了，起码把题做完整。';
    }

    function sumToLevel(score) {
      if (score <= 3) return 'L';
      if (score === 4) return 'M';
      return 'H';
    }

    function levelNum(level) {
      return { L: 1, M: 2, H: 3 }[level];
    }

    function parsePattern(pattern) {
      return pattern.replace(/-/g, '').split('');
    }

    function getDrunkTriggered() {
      return app.answers[DRUNK_TRIGGER_QUESTION_ID] === 2;
    }

    function computeResult() {
      const rawScores = {};
      const levels = {};
      Object.keys(dimensionMeta).forEach(dim => { rawScores[dim] = 0; });

      questions.forEach(q => {
        rawScores[q.dim] += Number(app.answers[q.id] || 0);
      });

      Object.entries(rawScores).forEach(([dim, score]) => {
        levels[dim] = sumToLevel(score);
      });

      const userVector = dimensionOrder.map(dim => levelNum(levels[dim]));
      const ranked = NORMAL_TYPES.map(type => {
        const vector = parsePattern(type.pattern).map(levelNum);
        let distance = 0;
        let exact = 0;
        for (let i = 0; i < vector.length; i++) {
          const diff = Math.abs(userVector[i] - vector[i]);
          distance += diff;
          if (diff === 0) exact += 1;
        }
        const similarity = Math.max(0, Math.round((1 - distance / 30) * 100));
        return { ...type, ...TYPE_LIBRARY[type.code], distance, exact, similarity };
      }).sort((a, b) => {
        if (a.distance !== b.distance) return a.distance - b.distance;
        if (b.exact !== a.exact) return b.exact - a.exact;
        return b.similarity - a.similarity;
      });

      const bestNormal = ranked[0];
      const drunkTriggered = getDrunkTriggered();

      let finalType;
      let modeKicker = '你的主类型';
      let badge = `匹配度 ${bestNormal.similarity}% · 精准命中 ${bestNormal.exact}/15 维`;
      let sub = '维度命中度较高，当前结果可视为你的第一人格画像。';
      let special = false;
      let secondaryType = null;

      if (drunkTriggered) {
        finalType = TYPE_LIBRARY.DRUNK;
        secondaryType = bestNormal;
        modeKicker = '隐藏人格已激活';
        badge = '匹配度 100% · 酒精异常因子已接管';
        sub = '乙醇亲和性过强，系统已直接跳过常规人格审判。';
        special = true;
      } else if (bestNormal.similarity < 60) {
        finalType = TYPE_LIBRARY.HHHH;
        modeKicker = '系统强制兜底';
        badge = `标准人格库最高匹配仅 ${bestNormal.similarity}%`;
        sub = '标准人格库对你的脑回路集体罢工了，于是系统把你强制分配给了 HHHH。';
        special = true;
      } else {
        finalType = bestNormal;
      }

      return {
        rawScores,
        levels,
        ranked,
        bestNormal,
        finalType,
        modeKicker,
        badge,
        sub,
        special,
        secondaryType
      };
    }

        wechatWidget.classList.add('visible');
      }

      if (trigger) trigger.addEventListener('click', () => toggleWidget());
      if (closeBtn) closeBtn.addEventListener('click', () => toggleWidget(false));

      const originalShowScreen = window.showScreen || showScreen;
      window.showScreen = function(name, options) {
        originalShowScreen(name, options);
        updateWidgetVisibility();
      };

      updateWidgetVisibility();
    })();

    /* --- Disable Developer Console and Inspection --- */
    (function() {
      // Disable right-click
      document.addEventListener('contextmenu', e => e.preventDefault());

      // Disable specific keyboard shortcuts
      document.addEventListener('keydown', e => {
        // F12
        if (e.key === 'F12') {
          e.preventDefault();
          return false;
        }
        // Ctrl+Shift+I (Inspect), Ctrl+Shift+J (Console), Ctrl+Shift+C (Element selection)
        // Ctrl+U (View source)
        if (e.ctrlKey && (e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C') || e.key === 'u')) {
          e.preventDefault();
          return false;
        }
      });

      // Optional: debugger trap to freeze page when DevTools is opened
      // (Used by many production sites for protection)
      setInterval(() => {
        (function() {
          try {
            (function a(i) {
              if (("" + i / i).length !== 1 || i % 20 === 0) {
                (function() {}).constructor("debugger")();
              } else {
                debugger;
              }
              a(++i);
            })(0);
          } catch (e) {}
        })();
      }, 2000);
    })();
  </script>
