<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员登录</title>
    <style>
        :root {
            --bg: #f4f7fb;
            --panel: rgba(255, 255, 255, 0.92);
            --border: rgba(148, 163, 184, 0.24);
            --text: #0f172a;
            --subtext: #475569;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --error: #b42318;
            --success: #047857;
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background:
                radial-gradient(circle at top left, rgba(56, 189, 248, 0.18), transparent 28%),
                radial-gradient(circle at bottom right, rgba(37, 99, 235, 0.14), transparent 32%),
                var(--bg);
            color: var(--text);
        }

        .panel {
            width: min(420px, 100%);
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 20px 44px rgba(15, 23, 42, 0.1);
            padding: 28px;
        }

        .header {
            margin-bottom: 22px;
        }

        .title {
            font-size: 24px;
            font-weight: 700;
        }

        .subtitle {
            margin-top: 8px;
            color: var(--subtext);
            font-size: 13px;
            line-height: 1.6;
        }

        .alert {
            display: none;
            margin-bottom: 16px;
            border-radius: 10px;
            border: 1px solid var(--border);
            padding: 12px 14px;
            font-size: 13px;
            line-height: 1.5;
        }

        .alert.show {
            display: block;
        }

        .alert.error {
            color: var(--error);
            border-color: rgba(180, 35, 24, 0.22);
            background: rgba(180, 35, 24, 0.08);
        }

        .alert.success {
            color: var(--success);
            border-color: rgba(4, 120, 87, 0.24);
            background: rgba(4, 120, 87, 0.08);
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 13px;
            font-weight: 650;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 14px;
            color: var(--text);
            background: #fff;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--subtext);
            font-size: 13px;
        }

        .remember input {
            width: 15px;
            height: 15px;
        }

        .setup-only {
            display: none;
        }

        body.setup-mode .login-only {
            display: none;
        }

        body.setup-mode .setup-only {
            display: flex;
        }

        button {
            min-height: 42px;
            border: none;
            border-radius: 10px;
            background: var(--accent);
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            background: var(--accent-hover);
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="panel">
        <div class="header">
            <div class="title" id="page-title">管理员登录</div>
            <div class="subtitle" id="page-subtitle">登录后通过同源 HttpOnly Cookie 维持后台会话，不再依赖浏览器本地 token。</div>
        </div>

        <div class="alert" id="alert-box"></div>

        <form id="login-form">
            <div class="field">
                <label for="username">用户名</label>
                <input id="username" type="text" autocomplete="username" required>
            </div>
            <div class="field">
                <label for="password">密码</label>
                <input id="password" type="password" autocomplete="current-password" required>
            </div>
            <div class="field setup-only">
                <label for="confirm-password">确认密码</label>
                <input id="confirm-password" type="password" autocomplete="new-password">
            </div>
            <label class="remember login-only">
                <input id="remember-me" type="checkbox">
                <span>记住我（7 天）</span>
            </label>
            <button id="login-btn" type="submit">登录</button>
        </form>
    </div>

    <script>
        const alertBox = document.getElementById('alert-box');
        const loginForm = document.getElementById('login-form');
        const loginBtn = document.getElementById('login-btn');
        const setupRequired = {{ 'true' if setup_required else 'false' }};

        function showAlert(message, type) {
            alertBox.className = `alert show ${type}`;
            alertBox.textContent = message;
        }

        function setBusy(busy) {
            loginBtn.disabled = busy;
            if (setupRequired) {
                loginBtn.textContent = busy ? '创建中...' : '创建管理员';
            } else {
                loginBtn.textContent = busy ? '登录中...' : '登录';
            }
        }

        async function sha256Hex(input) {
            const bytes = new TextEncoder().encode(String(input));
            if (globalThis.crypto && crypto.subtle) {
                const digest = await crypto.subtle.digest('SHA-256', bytes);
                return Array.from(new Uint8Array(digest)).map((item) => item.toString(16).padStart(2, '0')).join('');
            }
            return sha256HexFallback(bytes);
        }

        function sha256HexFallback(bytes) {
            const k = [
                0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
                0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
                0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
                0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
                0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
                0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
                0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
                0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2,
            ];
            const h = [0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19];
            const message = Array.from(bytes);
            const bitLength = message.length * 8;
            message.push(0x80);
            while ((message.length % 64) !== 56) message.push(0);
            const high = Math.floor(bitLength / 0x100000000);
            const low = bitLength >>> 0;
            for (let shift = 24; shift >= 0; shift -= 8) message.push((high >>> shift) & 0xff);
            for (let shift = 24; shift >= 0; shift -= 8) message.push((low >>> shift) & 0xff);

            const rotr = (value, shift) => (value >>> shift) | (value << (32 - shift));
            const w = new Array(64);
            for (let offset = 0; offset < message.length; offset += 64) {
                for (let i = 0; i < 16; i++) {
                    const index = offset + i * 4;
                    w[i] = ((message[index] << 24) | (message[index + 1] << 16) | (message[index + 2] << 8) | message[index + 3]) >>> 0;
                }
                for (let i = 16; i < 64; i++) {
                    const s0 = (rotr(w[i - 15], 7) ^ rotr(w[i - 15], 18) ^ (w[i - 15] >>> 3)) >>> 0;
                    const s1 = (rotr(w[i - 2], 17) ^ rotr(w[i - 2], 19) ^ (w[i - 2] >>> 10)) >>> 0;
                    w[i] = (w[i - 16] + s0 + w[i - 7] + s1) >>> 0;
                }
                let [a, b, c, d, e, f, g, hh] = h;
                for (let i = 0; i < 64; i++) {
                    const s1 = (rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25)) >>> 0;
                    const ch = ((e & f) ^ (~e & g)) >>> 0;
                    const temp1 = (hh + s1 + ch + k[i] + w[i]) >>> 0;
                    const s0 = (rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22)) >>> 0;
                    const maj = ((a & b) ^ (a & c) ^ (b & c)) >>> 0;
                    const temp2 = (s0 + maj) >>> 0;
                    hh = g;
                    g = f;
                    f = e;
                    e = (d + temp1) >>> 0;
                    d = c;
                    c = b;
                    b = a;
                    a = (temp1 + temp2) >>> 0;
                }
                h[0] = (h[0] + a) >>> 0;
                h[1] = (h[1] + b) >>> 0;
                h[2] = (h[2] + c) >>> 0;
                h[3] = (h[3] + d) >>> 0;
                h[4] = (h[4] + e) >>> 0;
                h[5] = (h[5] + f) >>> 0;
                h[6] = (h[6] + g) >>> 0;
                h[7] = (h[7] + hh) >>> 0;
            }
            return h.map((value) => value.toString(16).padStart(8, '0')).join('');
        }

        async function handleLogin(event) {
            event.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('remember-me').checked;

            if (!username || !password) {
                showAlert('请输入用户名和密码。', 'error');
                return;
            }

            if (setupRequired) {
                const confirmPassword = document.getElementById('confirm-password').value;
                if (password.length < 8) {
                    showAlert('管理员密码至少 8 位。', 'error');
                    return;
                }
                if (password !== confirmPassword) {
                    showAlert('两次输入的密码不一致。', 'error');
                    return;
                }
            }

            setBusy(true);
            try {
                const storedHash = await sha256Hex(password);
                let response;
                if (setupRequired) {
                    response = await fetch('/api/auth/setup', {
                        method: 'POST',
                        credentials: 'same-origin',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            username,
                            password_hash: storedHash,
                        }),
                    });
                } else {
                    const timestamp = Date.now();
                    const nonce = crypto.getRandomValues(new Uint32Array(4)).join('');
                    const passwordHash = await sha256Hex(`${storedHash}${timestamp}${nonce}`);
                    response = await fetch('/api/auth/login', {
                        method: 'POST',
                        credentials: 'same-origin',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            username,
                            password_hash: passwordHash,
                            timestamp,
                            nonce,
                            remember_me: rememberMe,
                        }),
                    });
                }

                const data = await response.json().catch(() => ({}));
                if (!response.ok || data.success === false) {
                    throw new Error(data.error || data.detail || '登录失败');
                }

                showAlert(data.message || '登录成功', 'success');
                window.location.href = '/index';
            } catch (error) {
                showAlert(error.message || '登录失败', 'error');
            } finally {
                setBusy(false);
            }
        }

        if (setupRequired) {
            document.body.classList.add('setup-mode');
            document.getElementById('page-title').textContent = '首次设置管理员';
            document.getElementById('page-subtitle').textContent = '当前还没有后台管理员。创建第一个管理员后，初始化入口会自动关闭。';
            document.getElementById('password').setAttribute('autocomplete', 'new-password');
            loginBtn.textContent = '创建管理员';
        }

        loginForm.addEventListener('submit', handleLogin);
        document.getElementById('username').focus();
    </script>
</body>
</html>
