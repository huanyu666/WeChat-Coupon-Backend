<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员登录</title>
    <style>
        :root {
            --bg: #f4f7fb;
            --panel: rgba(255, 255, 255, 0.92);
            --border: rgba(148, 163, 184, 0.24);
            --text: #0f172a;
            --subtext: #475569;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --error: #b42318;
            --success: #047857;
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background:
                radial-gradient(circle at top left, rgba(56, 189, 248, 0.18), transparent 28%),
                radial-gradient(circle at bottom right, rgba(37, 99, 235, 0.14), transparent 32%),
                var(--bg);
            color: var(--text);
        }

        .panel {
            width: min(420px, 100%);
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 20px 44px rgba(15, 23, 42, 0.1);
            padding: 28px;
        }

        .header {
            margin-bottom: 22px;
        }

        .title {
            font-size: 24px;
            font-weight: 700;
        }

        .subtitle {
            margin-top: 8px;
            color: var(--subtext);
            font-size: 13px;
            line-height: 1.6;
        }

        .alert {
            display: none;
            margin-bottom: 16px;
            border-radius: 10px;
            border: 1px solid var(--border);
            padding: 12px 14px;
            font-size: 13px;
            line-height: 1.5;
        }

        .alert.show {
            display: block;
        }

        .alert.error {
            color: var(--error);
            border-color: rgba(180, 35, 24, 0.22);
            background: rgba(180, 35, 24, 0.08);
        }

        .alert.success {
            color: var(--success);
            border-color: rgba(4, 120, 87, 0.24);
            background: rgba(4, 120, 87, 0.08);
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 13px;
            font-weight: 650;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 14px;
            color: var(--text);
            background: #fff;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--subtext);
            font-size: 13px;
        }

        .remember input {
            width: 15px;
            height: 15px;
        }

        button {
            min-height: 42px;
            border: none;
            border-radius: 10px;
            background: var(--accent);
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            background: var(--accent-hover);
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="panel">
        <div class="header">
            <div class="title">管理员登录</div>
            <div class="subtitle">登录后通过同源 HttpOnly Cookie 维持后台会话，不再依赖浏览器本地 token。</div>
        </div>

        <div class="alert" id="alert-box"></div>

        <form id="login-form">
            <div class="field">
                <label for="username">用户名</label>
                <input id="username" type="text" autocomplete="username" required>
            </div>
            <div class="field">
                <label for="password">密码</label>
                <input id="password" type="password" autocomplete="current-password" required>
            </div>
            <label class="remember">
                <input id="remember-me" type="checkbox">
                <span>记住我（7 天）</span>
            </label>
            <button id="login-btn" type="submit">登录</button>
        </form>
    </div>

    <script>
        const alertBox = document.getElementById('alert-box');
        const loginForm = document.getElementById('login-form');
        const loginBtn = document.getElementById('login-btn');

        function showAlert(message, type) {
            alertBox.className = `alert show ${type}`;
            alertBox.textContent = message;
        }

        function setBusy(busy) {
            loginBtn.disabled = busy;
            loginBtn.textContent = busy ? '登录中...' : '登录';
        }

        async function sha256Hex(input) {
            const buffer = new TextEncoder().encode(input);
            const digest = await crypto.subtle.digest('SHA-256', buffer);
            return Array.from(new Uint8Array(digest)).map((item) => item.toString(16).padStart(2, '0')).join('');
        }

        async function handleLogin(event) {
            event.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('remember-me').checked;

            if (!username || !password) {
                showAlert('请输入用户名和密码。', 'error');
                return;
            }

            setBusy(true);
            try {
                const timestamp = Date.now();
                const nonce = crypto.getRandomValues(new Uint32Array(4)).join('');
                const storedHash = await sha256Hex(password);
                const passwordHash = await sha256Hex(`${storedHash}${timestamp}${nonce}`);

                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username,
                        password_hash: passwordHash,
                        timestamp,
                        nonce,
                        remember_me: rememberMe,
                    }),
                });

                const data = await response.json().catch(() => ({}));
                if (!response.ok || data.success === false) {
                    throw new Error(data.error || data.detail || '登录失败');
                }

                showAlert(data.message || '登录成功', 'success');
                window.location.href = '/index';
            } catch (error) {
                showAlert(error.message || '登录失败', 'error');
            } finally {
                setBusy(false);
            }
        }

        loginForm.addEventListener('submit', handleLogin);
        document.getElementById('username').focus();
    </script>
</body>
</html>
