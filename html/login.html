<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 微信素材管理系统</title>
    <style>
        :root {
            --bg-main: #e2e8f0;
            --glass-bg: rgba(255, 255, 255, 0.45);
            --glass-border: rgba(255, 255, 255, 0.5);
            --glass-highlight: rgba(255, 255, 255, 0.8);
            --glass-input-bg: rgba(255, 255, 255, 0.35);
            --text-primary: #334155;
            --text-secondary: #64748b;
            --blue: #1d4ed8;
            --blue-hover: #1e40af;
            --radius-lg: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
            background: var(--bg-main);
            color: var(--text-primary);
            font-family: Inter, "Source Han Sans CN", "PingFang SC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .bg-shape {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            z-index: -1;
            opacity: 0.45;
            pointer-events: none;
        }

        .shape-1 {
            top: -10%;
            left: -5%;
            width: 500px;
            height: 500px;
            background: #7dd3fc;
        }

        .shape-2 {
            right: -5%;
            bottom: -15%;
            width: 600px;
            height: 600px;
            background: #99f6e4;
        }

        .shape-3 {
            top: 30%;
            left: 40%;
            width: 400px;
            height: 400px;
            background: #c4b5fd;
            opacity: 0.35;
        }

        .login-container {
            width: min(440px, 100%);
            padding: 50px 40px;
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            border-top-color: var(--glass-highlight);
            border-left-color: var(--glass-highlight);
            border-radius: var(--radius-lg);
            box-shadow: 0 4px 24px rgba(15, 23, 42, 0.06);
        }

        .login-header {
            text-align: center;
            margin-bottom: 34px;
        }

        .login-icon {
            width: 52px;
            height: 52px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
            background: rgba(29, 78, 216, 0.08);
            border: 1px solid rgba(29, 78, 216, 0.12);
            color: var(--blue);
        }

        .login-svg,
        .toggle-svg {
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .login-svg {
            width: 26px;
            height: 26px;
        }

        .toggle-svg {
            width: 18px;
            height: 18px;
        }

        .login-title {
            margin-bottom: 10px;
            color: var(--text-primary);
            font-size: 2rem;
            font-weight: 700;
        }

        .login-subtitle {
            color: var(--text-secondary);
            font-size: 1rem;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .alert-error {
            background: rgba(185, 28, 28, 0.1);
            border: 1px solid rgba(185, 28, 28, 0.2);
            color: #b91c1c;
        }

        .alert-success {
            background: rgba(15, 118, 110, 0.1);
            border: 1px solid rgba(15, 118, 110, 0.2);
            color: #0f766e;
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-label {
            display: block;
            margin-bottom: 10px;
            color: var(--text-secondary);
            font-size: 0.95rem;
            font-weight: 500;
        }

        .form-input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            background: var(--glass-input-bg);
            color: var(--text-primary);
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.02);
            font-size: 1rem;
            transition: all 0.2s ease;
        }

        .form-input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.7);
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .form-input::placeholder {
            color: #94a3b8;
        }

        .password-toggle {
            position: relative;
        }

        .password-toggle .form-input {
            padding-right: 48px;
        }

        .toggle-btn {
            position: absolute;
            right: 14px;
            top: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            padding: 0;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
        }

        .toggle-btn:hover {
            color: var(--text-primary);
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .remember-me input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .remember-me label {
            cursor: pointer;
            user-select: none;
        }

        .setup-only {
            display: none;
        }

        body.setup-mode .login-only {
            display: none;
        }

        body.setup-mode .setup-only {
            display: block;
        }

        .btn-login {
            width: 100%;
            min-height: 52px;
            padding: 14px 16px;
            border: 1px solid var(--blue);
            border-radius: 10px;
            background: var(--blue);
            color: #fff;
            box-shadow: 0 4px 12px rgba(29, 78, 216, 0.15);
            cursor: pointer;
            font-size: 1.05rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .btn-login:hover:not(:disabled) {
            transform: translateY(-1px);
            background: var(--blue-hover);
            box-shadow: 0 6px 16px rgba(29, 78, 216, 0.25);
        }

        .btn-login:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .footer-note {
            margin-top: 26px;
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 40px 30px;
            }

            .login-title {
                font-size: 1.6rem;
            }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>
    <div class="bg-shape shape-3"></div>

    <div class="login-container">
        <div class="login-header">
            <div class="login-icon">
                <svg class="login-svg" viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="5" y="10" width="14" height="10" rx="2"></rect>
                    <path d="M8 10V8a4 4 0 0 1 8 0v2"></path>
                    <path d="M12 14v3"></path>
                </svg>
            </div>
            <h1 class="login-title" id="page-title">管理员登录</h1>
            <p class="login-subtitle" id="page-subtitle">微信素材管理系统</p>
        </div>

        <div id="alert-box"></div>

        <form id="login-form">
            <div class="form-group">
                <label class="form-label" for="username">用户名</label>
                <input id="username" class="form-input" type="text" placeholder="请输入用户名" autocomplete="username" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">密码</label>
                <div class="password-toggle">
                    <input id="password" class="form-input" type="password" placeholder="请输入密码" autocomplete="current-password" required>
                    <button type="button" class="toggle-btn" onclick="togglePassword()" aria-label="显示或隐藏密码">
                        <svg class="toggle-svg" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="form-group setup-only">
                <label class="form-label" for="confirm-password">确认密码</label>
                <input id="confirm-password" class="form-input" type="password" placeholder="请再次输入密码" autocomplete="new-password">
            </div>

            <div class="remember-me login-only">
                <input id="remember-me" type="checkbox">
                <label for="remember-me">记住我（7天）</label>
            </div>

            <button id="login-btn" class="btn-login" type="submit">登录</button>
        </form>

        <div class="footer-note">Cookie 会话用于保持后台登录状态</div>
    </div>

    <script>
        const alertBox = document.getElementById('alert-box');
        const loginForm = document.getElementById('login-form');
        const loginBtn = document.getElementById('login-btn');
        const setupRequired = {{ 'true' if setup_required else 'false' }};

        function showAlert(message, type) {
            alertBox.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
        }

        function setBusy(busy) {
            loginBtn.disabled = busy;
            loginBtn.textContent = setupRequired
                ? (busy ? '创建中...' : '创建管理员')
                : (busy ? '登录中...' : '登录');
        }

        function togglePassword() {
            const password = document.getElementById('password');
            password.type = password.type === 'password' ? 'text' : 'password';
        }

        async function sha256Hex(input) {
            const bytes = new TextEncoder().encode(String(input));
            if (globalThis.crypto && crypto.subtle) {
                const digest = await crypto.subtle.digest('SHA-256', bytes);
                return Array.from(new Uint8Array(digest)).map((item) => item.toString(16).padStart(2, '0')).join('');
            }
            return sha256HexFallback(bytes);
        }

        function sha256HexFallback(bytes) {
            const k = [
                0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
                0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
                0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
                0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
                0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
                0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
                0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
                0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2,
            ];
            const h = [0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19];
            const message = Array.from(bytes);
            const bitLength = message.length * 8;
            message.push(0x80);
            while ((message.length % 64) !== 56) message.push(0);
            const high = Math.floor(bitLength / 0x100000000);
            const low = bitLength >>> 0;
            for (let shift = 24; shift >= 0; shift -= 8) message.push((high >>> shift) & 0xff);
            for (let shift = 24; shift >= 0; shift -= 8) message.push((low >>> shift) & 0xff);

            const rotr = (value, shift) => (value >>> shift) | (value << (32 - shift));
            const w = new Array(64);
            for (let offset = 0; offset < message.length; offset += 64) {
                for (let i = 0; i < 16; i++) {
                    const index = offset + i * 4;
                    w[i] = ((message[index] << 24) | (message[index + 1] << 16) | (message[index + 2] << 8) | message[index + 3]) >>> 0;
                }
                for (let i = 16; i < 64; i++) {
                    const s0 = (rotr(w[i - 15], 7) ^ rotr(w[i - 15], 18) ^ (w[i - 15] >>> 3)) >>> 0;
                    const s1 = (rotr(w[i - 2], 17) ^ rotr(w[i - 2], 19) ^ (w[i - 2] >>> 10)) >>> 0;
                    w[i] = (w[i - 16] + s0 + w[i - 7] + s1) >>> 0;
                }
                let [a, b, c, d, e, f, g, hh] = h;
                for (let i = 0; i < 64; i++) {
                    const s1 = (rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25)) >>> 0;
                    const ch = ((e & f) ^ (~e & g)) >>> 0;
                    const temp1 = (hh + s1 + ch + k[i] + w[i]) >>> 0;
                    const s0 = (rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22)) >>> 0;
                    const maj = ((a & b) ^ (a & c) ^ (b & c)) >>> 0;
                    const temp2 = (s0 + maj) >>> 0;
                    hh = g;
                    g = f;
                    f = e;
                    e = (d + temp1) >>> 0;
                    d = c;
                    c = b;
                    b = a;
                    a = (temp1 + temp2) >>> 0;
                }
                h[0] = (h[0] + a) >>> 0;
                h[1] = (h[1] + b) >>> 0;
                h[2] = (h[2] + c) >>> 0;
                h[3] = (h[3] + d) >>> 0;
                h[4] = (h[4] + e) >>> 0;
                h[5] = (h[5] + f) >>> 0;
                h[6] = (h[6] + g) >>> 0;
                h[7] = (h[7] + hh) >>> 0;
            }
            return h.map((value) => value.toString(16).padStart(8, '0')).join('');
        }

        async function handleLogin(event) {
            event.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('remember-me').checked;

            if (!username || !password) {
                showAlert('请输入用户名和密码。', 'error');
                return;
            }

            if (setupRequired) {
                const confirmPassword = document.getElementById('confirm-password').value;
                if (password.length < 8) {
                    showAlert('管理员密码至少 8 位。', 'error');
                    return;
                }
                if (password !== confirmPassword) {
                    showAlert('两次输入的密码不一致。', 'error');
                    return;
                }
            }

            setBusy(true);
            try {
                const storedHash = await sha256Hex(password);
                let response;
                if (setupRequired) {
                    response = await fetch('/api/auth/setup', {
                        method: 'POST',
                        credentials: 'same-origin',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({username, password_hash: storedHash}),
                    });
                } else {
                    const timestamp = Date.now();
                    const nonce = crypto.getRandomValues(new Uint32Array(4)).join('');
                    const passwordHash = await sha256Hex(`${storedHash}${timestamp}${nonce}`);
                    response = await fetch('/api/auth/login', {
                        method: 'POST',
                        credentials: 'same-origin',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({
                            username,
                            password_hash: passwordHash,
                            timestamp,
                            nonce,
                            remember_me: rememberMe,
                        }),
                    });
                }

                const data = await response.json().catch(() => ({}));
                if (!response.ok || data.success === false) {
                    throw new Error(data.error || data.detail || '登录失败');
                }

                showAlert(data.message || '登录成功', 'success');
                window.location.href = '/index';
            } catch (error) {
                showAlert(error.message || '登录失败', 'error');
            } finally {
                setBusy(false);
            }
        }

        if (setupRequired) {
            document.body.classList.add('setup-mode');
            document.getElementById('page-title').textContent = '首次设置管理员';
            document.getElementById('page-subtitle').textContent = '创建第一个后台管理员';
            document.getElementById('password').setAttribute('autocomplete', 'new-password');
            loginBtn.textContent = '创建管理员';
        }

        loginForm.addEventListener('submit', handleLogin);
        document.getElementById('username').focus();
    </script>
</body>
</html>
