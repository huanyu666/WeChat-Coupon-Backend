<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理系统首页 - 微信公众号管理</title>
    <style>

        :root {
            --bg-main: #E2E8F0;
            --glass-bg: rgba(255, 255, 255, 0.45);
            --glass-bg-hover: rgba(255, 255, 255, 0.6);
            --glass-border: rgba(255, 255, 255, 0.5);
            --glass-highlight: rgba(255, 255, 255, 0.8);
            --glass-input-bg: rgba(255, 255, 255, 0.35);
            --text-primary: #334155;
            --text-secondary: #64748B;
            --text-muted: #94A3B8;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg-main);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 40px;
            color: white;
            animation: fadeInDown 0.6s ease-out;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .header-left p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .user-info {
            text-align: right;
        }

        .username {
            font-size: 1.2rem;
            margin-bottom: 10px;
            font-weight: 500;
        }

        .btn-logout {
            background: rgba(255, 255, 255, 0.3);
            border: 2px solid white;
            color: white;
            padding: 10px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn-logout:hover {
            background: rgba(255, 255, 255, 0.5);
            transform: translateY(-2px);
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 30px;
            animation: fadeInUp 0.6s ease-out;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .card-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            text-align: center;
        }

        .card-title {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 15px;
            color: #191919;
            text-align: center;
        }

        .card-description {
            font-size: 1rem;
            color: #646566;
            line-height: 1.8;
            text-align: center;
        }

        .card.featured {
            background: var(--glass-bg);
            color: white;
        }

        .card.featured .card-title,
        .card.featured .card-description {
            color: white;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
            animation: fadeIn 0.8s ease-out;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 25px;
            color: white;
            text-align: center;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .stat-label {
            font-size: 1rem;
            opacity: 0.9;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                text-align: center;
            }

            .header-left h1 {
                font-size: 2rem;
            }

            .user-info {
                text-align: center;
                margin-top: 20px;
            }

            .cards-grid {
                grid-template-columns: 1fr;
            }
        }

        .footer {
            text-align: center;
            color: white;
            margin-top: 50px;
            opacity: 0.8;
            animation: fadeIn 1s ease-out;
        }
    
        body {
            background: var(--bg-main) !important;
            color: var(--text-primary) !important;
            font-family: 'Inter', 'Source Han Sans CN', 'PingFang SC', sans-serif !important;
        }
        
        .bg-shape {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            z-index: -1;
            opacity: 0.45;
            pointer-events: none;
        }
        .shape-1 { top: -10%; left: -5%; width: 500px; height: 500px; background: #7DD3FC; }

        .panel, .login-container, .card, .glass-card, .header {
            background: var(--glass-bg) !important;
            backdrop-filter: blur(24px) !important;
            -webkit-backdrop-filter: blur(24px) !important;

            border-radius: var(--radius-lg) !important;
            box-shadow: 0 4px 24px rgba(15, 23, 42, 0.06) !important;
        }
        
        .header, .topbar { color: var(--text-primary) !important; }
        .header-left h1 { color: var(--text-primary) !important; font-weight: 700 !important; text-shadow: none !important; }
        .header-left p, .user-info { color: var(--text-secondary) !important; text-shadow: none !important; }
        
        .card-icon { background: rgba(59, 130, 246, 0.1) !important; color: #1D4ED8 !important; }
        .card-title { color: var(--text-primary) !important; }
        .card-desc { color: var(--text-secondary) !important; }
        .btn-enter { background: #1D4ED8 !important; color: #FFFFFF !important; border: none !important; box-shadow: 0 4px 12px rgba(29, 78, 216, 0.15) !important; }
        .btn-enter:hover { background: #1E40AF !important; box-shadow: 0 6px 16px rgba(29, 78, 216, 0.25) !important; transform: translateY(-1px) !important; }
        
        .btn-logout { background: rgba(254, 242, 242, 0.5) !important; color: #B91C1C !important; border: 1px solid rgba(254, 202, 202, 0.5) !important; }
        .btn-logout:hover { background: #FEF2F2 !important; }

        /* Professional icon refinement */
        .header-left h1 {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .title-icon {
            width: 38px;
            height: 38px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            background: rgba(29, 78, 216, 0.08);
            color: #1D4ED8;
            border: 1px solid rgba(29, 78, 216, 0.12);
            flex: 0 0 auto;
        }
        .ui-icon,
        .inline-icon,
        .stat-icon,
        .card-svg {
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .ui-icon { width: 22px; height: 22px; }
        .inline-icon { width: 15px; height: 15px; }
        .username {
            display: inline-flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
            color: var(--text-secondary) !important;
            font-size: 14px !important;
            font-weight: 600 !important;
        }
        .username-icon {
            width: 24px;
            height: 24px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 999px;
            background: rgba(51, 65, 85, 0.06);
            color: var(--text-primary);
        }
        .btn-logout {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            padding: 9px 18px !important;
            font-size: 13px !important;
            border-radius: 10px !important;
        }
        .stat-value-icon {
            display: flex;
            justify-content: center;
            align-items: center;
            color: #0F766E;
        }
        .stat-icon {
            width: 34px;
            height: 34px;
        }
        .card {
            padding: 28px !important;
            text-align: left !important;
        }
        .card-icon {
            width: 48px;
            height: 48px;
            margin: 0 0 22px 0 !important;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
            background: rgba(29, 78, 216, 0.08) !important;
            color: #1D4ED8 !important;
            border: 1px solid rgba(29, 78, 216, 0.12);

        .card-svg {

        .card-title,

        .card-title {

        }
        .card-description {
            font-size: 14px !important;

        }
        .card.featured {
            background: var(--glass-bg) !important;

        }
        .card.featured .card-title,

        .header,
