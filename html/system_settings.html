<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统设置</title>
    <style>
        :root {
            --bg: #f4f7fb;
            --panel: #ffffff;
            --panel-soft: #f8fafc;
            --border: #d8e0ea;
            --text: #1f2937;
            --subtext: #667085;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --warning: #b45309;
            --success: #047857;
            --error: #b42318;
            --radius: 8px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
        }

        .layout {
            max-width: 1200px;
            margin: 0 auto;
            padding: 28px 20px 48px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
            margin-bottom: 20px;
        }

        .title {
            font-size: 24px;
            font-weight: 700;
        }

        .subtitle {
            margin-top: 8px;
            color: var(--subtext);
            font-size: 13px;
            line-height: 1.6;
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .btn {
            min-height: 36px;
            border: 1px solid var(--border);
            background: #fff;
            color: var(--text);
            border-radius: var(--radius);
            padding: 8px 14px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-primary {
            border-color: var(--accent);
            background: var(--accent);
            color: #fff;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        .btn-small {
            min-height: 32px;
            padding: 6px 10px;
            font-size: 12px;
        }

        .alert {
            display: none;
            margin-bottom: 18px;
            padding: 12px 14px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background: var(--panel);
            font-size: 13px;
        }

        .alert.show {
            display: block;
        }

        .alert-success {
            color: var(--success);
            border-color: rgba(4, 120, 87, 0.24);
            background: rgba(4, 120, 87, 0.08);
        }

        .alert-error {
            color: var(--error);
            border-color: rgba(180, 35, 24, 0.22);
            background: rgba(180, 35, 24, 0.08);
        }

        .page-hint {
            margin-bottom: 18px;
            border: 1px solid rgba(37, 99, 235, 0.16);
            border-radius: var(--radius);
            background: #eff6ff;
            color: #1e3a8a;
            padding: 12px 14px;
            font-size: 13px;
            line-height: 1.65;
        }

        .section {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin-bottom: 18px;
            overflow: hidden;
        }

        .section-header {
            width: 100%;
            border: 0;
            background: transparent;
            color: inherit;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            padding: 18px 22px;
            text-align: left;
            cursor: pointer;
        }

        .section-title {
            font-size: 16px;
            font-weight: 700;
        }

        .section-note {
            margin-top: 6px;
            color: var(--subtext);
            font-size: 13px;
            line-height: 1.55;
        }

        .section-toggle-icon {
            width: 28px;
            height: 28px;
            border: 1px solid var(--border);
            border-radius: 999px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex: 0 0 auto;
            color: var(--subtext);
            font-size: 18px;
            line-height: 1;
            background: #fff;
        }

        .section-toggle-icon::before {
            content: "-";
            transform: translateY(-1px);
        }

        .section.collapsed .section-toggle-icon::before {
            content: "+";
            transform: none;
        }

        .section-body {
            padding: 0 22px 22px;
        }

        .section.collapsed .section-body {
            display: none;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }

        .card {
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--panel-soft);
            padding: 16px;
        }

        .card-title {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .stack {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .field label {
            font-size: 12px;
            font-weight: 650;
            color: var(--text);
        }

        input,
        textarea {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: #fff;
            color: var(--text);
            font-size: 13px;
            padding: 10px 12px;
        }

        textarea {
            min-height: 92px;
            resize: vertical;
        }

        .full {
            grid-column: 1 / -1;
        }

        .readonly-value {
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: #fff;
            padding: 10px 12px;
            color: var(--text);
            font-size: 13px;
            min-height: 39px;
            display: flex;
            align-items: center;
        }

        .warning-note {
            border: 1px solid rgba(180, 83, 9, 0.22);
            border-radius: var(--radius);
            background: rgba(180, 83, 9, 0.08);
            color: var(--warning);
            padding: 10px 12px;
            font-size: 13px;
            line-height: 1.55;
        }

        @media (max-width: 960px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .topbar {
                flex-direction: column;
            }
        }
    </style>
</head>

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));

        function listValue(value) {
            if (Array.isArray(value)) {
                return value.join('\n');
            }
            return '';
        }

        function parseListValue(value) {
            return String(value || '')
                .split('\n')
                .map(item => item.trim())
                .filter(Boolean);
        }

        async function sha256Hex(input) {
            const bytes = new TextEncoder().encode(String(input));
            if (globalThis.crypto && crypto.subtle) {
                const digest = await crypto.subtle.digest('SHA-256', bytes);
                return Array.from(new Uint8Array(digest)).map((item) => item.toString(16).padStart(2, '0')).join('');
            }
            return sha256HexFallback(bytes);
        }

        function sha256HexFallback(bytes) {
            const k = [
                0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
                0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
                0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
                0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
                0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
                0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
                0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
                0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2,
            ];
            const h = [0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19];
            const message = Array.from(bytes);
            const bitLength = message.length * 8;
            message.push(0x80);
            while ((message.length % 64) !== 56) message.push(0);
            const high = Math.floor(bitLength / 0x100000000);
            const low = bitLength >>> 0;
            for (let shift = 24; shift >= 0; shift -= 8) message.push((high >>> shift) & 0xff);
            for (let shift = 24; shift >= 0; shift -= 8) message.push((low >>> shift) & 0xff);

            const rotr = (value, shift) => (value >>> shift) | (value << (32 - shift));
            const w = new Array(64);
            for (let offset = 0; offset < message.length; offset += 64) {
                for (let i = 0; i < 16; i++) {
                    const index = offset + i * 4;
                    w[i] = ((message[index] << 24) | (message[index + 1] << 16) | (message[index + 2] << 8) | message[index + 3]) >>> 0;
                }
                for (let i = 16; i < 64; i++) {
                    const s0 = (rotr(w[i - 15], 7) ^ rotr(w[i - 15], 18) ^ (w[i - 15] >>> 3)) >>> 0;
                    const s1 = (rotr(w[i - 2], 17) ^ rotr(w[i - 2], 19) ^ (w[i - 2] >>> 10)) >>> 0;
                    w[i] = (w[i - 16] + s0 + w[i - 7] + s1) >>> 0;
                }
                let [a, b, c, d, e, f, g, hh] = h;
                for (let i = 0; i < 64; i++) {
                    const s1 = (rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25)) >>> 0;
                    const ch = ((e & f) ^ (~e & g)) >>> 0;
                    const temp1 = (hh + s1 + ch + k[i] + w[i]) >>> 0;
                    const s0 = (rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22)) >>> 0;
                    const maj = ((a & b) ^ (a & c) ^ (b & c)) >>> 0;
                    const temp2 = (s0 + maj) >>> 0;
                    hh = g;
                    g = f;
                    f = e;
                    e = (d + temp1) >>> 0;
                    d = c;
                    c = b;
                    b = a;
                    a = (temp1 + temp2) >>> 0;
                }
                h[0] = (h[0] + a) >>> 0;
                h[1] = (h[1] + b) >>> 0;
                h[2] = (h[2] + c) >>> 0;
                h[3] = (h[3] + d) >>> 0;
                h[4] = (h[4] + e) >>> 0;
                h[5] = (h[5] + f) >>> 0;
                h[6] = (h[6] + g) >>> 0;
                h[7] = (h[7] + hh) >>> 0;
            }
            return h.map((value) => value.toString(16).padStart(8, '0')).join('');
        }

        function createFieldHtml(sectionType, sectionKey, field, value) {
            const fieldId = `${sectionType}-${sectionKey}-${field.key}`;
            const normalizedValue = field.type === 'list' ? listValue(value) : String(value ?? '');
            if (field.type === 'textarea' || field.type === 'list') {
                return `
                    <div class="field ${field.type === 'textarea' ? 'full' : ''}">
                        <label for="${escapeHtml(fieldId)}">${escapeHtml(field.label)}</label>
                        <textarea id="${escapeHtml(fieldId)}" data-section-type="${escapeHtml(sectionType)}" data-section-key="${escapeHtml(sectionKey)}" data-field-key="${escapeHtml(field.key)}" data-field-type="${escapeHtml(field.type)}">${escapeHtml(normalizedValue)}</textarea>
                    </div>
                `;
            }
            return `
                <div class="field">
                    <label for="${escapeHtml(fieldId)}">${escapeHtml(field.label)}</label>
                    <input id="${escapeHtml(fieldId)}" value="${escapeHtml(normalizedValue)}" data-section-type="${escapeHtml(sectionType)}" data-section-key="${escapeHtml(sectionKey)}" data-field-key="${escapeHtml(field.key)}" data-field-type="${escapeHtml(field.type)}">
                </div>
            `;
        }

        function renderPromptSections(settings) {
            promptsGrid.innerHTML = promptSections.map((section) => {
                const current = settings[section.key] || {};
                return `
                    <div class="card">
                        <div class="card-title">${escapeHtml(section.title)}</div>
                        <div class="stack">
                            ${section.fields.map((field) => createFieldHtml('prompts', section.key, field, current[field.key])).join('')}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderLinkSections(settings) {
            linkConfigGrid.innerHTML = linkSections.map((section) => {
                const current = settings[section.key] || {};
                return `
                    <div class="card">
                        <div class="card-title">${escapeHtml(section.title)}</div>
                        <div class="stack">
                            ${createFieldHtml('links', section.key, { key: 'description', label: '描述', type: 'input' }, current.description)}
                            ${createFieldHtml('links', section.key, { key: 'patterns', label: '前缀列表', type: 'list' }, current.patterns)}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderLeaderboardSection(settings) {
            const current = settings.global || {};
            leaderboardGrid.innerHTML = `
                <div class="card full">
                    <div class="card-title">global</div>
                    <div class="grid">
                        ${leaderboardFields.map((field) => createFieldHtml('leaderboard', 'global', field, current[field.key])).join('')}
                    </div>
                </div>
            `;
        }

        function renderShortlinkConfig(runtimeStore) {
            const config = (runtimeStore && runtimeStore.shortlink_config) || {};
            shortlinkPublicBaseUrlInput.value = String(config.public_base_url || '');
            const ttlSeconds = Number(config.default_ttl_seconds || 604800);
            shortlinkDefaultTtlDaysInput.value = String(Math.max(1, Math.round(ttlSeconds / 86400)));
        }

        async function requestJson(url, options = {}) {
            const headers = {
                'Content-Type': 'application/json',
                ...(options.headers || {}),
            };
            const response = await fetch(url, {
                ...options,
                headers,
                credentials: 'same-origin',
            });
            if (response.status === 401) {
                window.location.href = '/login';
                throw new Error('登录已过期');
            }
            const data = await response.json().catch(() => ({}));
            if (!response.ok || data.success === false) {
                throw new Error(data.error || data.detail || data.message || '请求失败');
            }
            return data;
        }

        function collectSection(sectionType) {
            const values = {};
            document.querySelectorAll(`[data-section-type="${sectionType}"]`).forEach((element) => {
                const sectionKey = element.dataset.sectionKey;
                const fieldKey = element.dataset.fieldKey;
                const fieldType = element.dataset.fieldType;
                values[sectionKey] = values[sectionKey] || {};
                values[sectionKey][fieldKey] = fieldType === 'list' ? parseListValue(element.value) : element.value;
            });
            return values;
        }

        async function loadSettings() {
            hideAlert();
            try {
                const data = await requestJson('/api/system-settings');
                renderPromptSections(data.prompts_config || {});
                renderLinkSections(data.link_config || {});
                renderLeaderboardSection(data.order_leaderboard_config || {});
                renderShortlinkConfig(data.runtime_store || {});
                await loadAdminUsers();
            } catch (error) {
                showAlert(error.message || '加载系统设置失败', 'error');
            }
        }

        function renderAdminUsers(data) {
            const currentUser = String(data.current_user || '').trim();
            const users = Array.isArray(data.users) ? data.users : [];
            adminUsernameInput.value = currentUser || users[0] || '';
        }

        async function loadAdminUsers() {
            const data = await requestJson('/api/system-settings/admin-users');
            renderAdminUsers(data);
        }

        async function saveAdminPassword() {
            hideAlert();
            const username = adminUsernameInput.value.trim();
            const password = document.getElementById('admin-password').value;
            const confirmPassword = document.getElementById('admin-password-confirm').value;
            if (!username) {
                showAlert('请输入管理员用户名', 'error');
                return;
            }
            if (!/^[A-Za-z0-9_.@-]{1,64}$/.test(username)) {
                showAlert('用户名只能包含字母、数字、下划线、点、@ 和短横线，长度 1-64', 'error');
                return;
            }
            if (!password) {
                showAlert('请输入新密码', 'error');
                return;
            }
            if (password.length < 8) {
                showAlert('管理员密码至少 8 位', 'error');
                return;
            }
            if (password !== confirmPassword) {
                showAlert('两次输入的新密码不一致', 'error');
                return;
            }

            try {
                const passwordHash = await sha256Hex(password);
                const data = await requestJson('/api/system-settings/admin-users', {
                    method: 'POST',
                    body: JSON.stringify({ username, password_hash: passwordHash }),
                });
                renderAdminUsers(data);
                document.getElementById('admin-password').value = '';
                document.getElementById('admin-password-confirm').value = '';
                showAlert(data.message || '管理员账号已修改，请重新登录', 'success');
                setTimeout(function () {
                    window.location.href = '/login';
                }, 900);
            } catch (error) {
                showAlert(error.message || '保存管理员账号失败', 'error');
            }
        }

        function setSectionCollapsed(section, collapsed) {
            section.classList.toggle('collapsed', collapsed);
            const button = section.querySelector('.section-header');
            if (button) {
                button.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
            }
        }

        function bindCollapsibleSections() {
            document.querySelectorAll('[data-collapsible]').forEach((section) => {
                const button = section.querySelector('.section-header');
                if (!button) return;
                button.addEventListener('click', () => {
                    setSectionCollapsed(section, !section.classList.contains('collapsed'));
                });
            });
        }

        function setAllSectionsCollapsed(collapsed) {
            document.querySelectorAll('[data-collapsible]').forEach((section) => {
                setSectionCollapsed(section, collapsed);
            });
        }

        async function saveSettings() {
            hideAlert();
            try {
                const shortlinkPublicBaseUrl = shortlinkPublicBaseUrlInput.value.trim().replace(/\/+$/, '');
                const shortlinkTtlDays = Number.parseInt(shortlinkDefaultTtlDaysInput.value, 10);
                if (!shortlinkPublicBaseUrl) {
                    showAlert('请输入短链公开地址', 'error');
                    return;
                }
                if (!/^https?:\/\//i.test(shortlinkPublicBaseUrl)) {
                    showAlert('短链公开地址必须以 http:// 或 https:// 开头', 'error');
                    return;
                }
                if (!Number.isFinite(shortlinkTtlDays) || shortlinkTtlDays <= 0) {
                    showAlert('默认有效期必须是大于 0 的天数', 'error');
                    return;
                }
                const payload = {
                    prompts_config: collectSection('prompts'),
                    link_config: collectSection('links'),
                    order_leaderboard_config: collectSection('leaderboard'),
                    shortlink_config: {
                        public_base_url: shortlinkPublicBaseUrl,
                        default_ttl_seconds: shortlinkTtlDays * 86400,
                        cleanup_timezone: 'Asia/Shanghai',
                        cleanup_time: '00:00',
                    },
                };
                const data = await requestJson('/api/system-settings', {
                    method: 'POST',
                    body: JSON.stringify(payload),
                });
                showAlert(data.message || '系统设置已保存', 'success');
                renderPromptSections(data.prompts_config || {});
                renderLinkSections(data.link_config || {});
                renderLeaderboardSection(data.order_leaderboard_config || {});
                renderShortlinkConfig(data.runtime_store || {});
            } catch (error) {
                showAlert(error.message || '保存系统设置失败', 'error');
            }
        }

        document.getElementById('home-btn').addEventListener('click', () => {
            window.location.href = '/index';
        });
        document.getElementById('account-btn').addEventListener('click', () => {
            window.location.href = '/wechat-account-settings';
        });
        document.getElementById('expand-all-btn').addEventListener('click', () => setAllSectionsCollapsed(false));
        document.getElementById('collapse-all-btn').addEventListener('click', () => setAllSectionsCollapsed(true));
        document.getElementById('refresh-btn').addEventListener('click', loadSettings);
        document.getElementById('save-btn').addEventListener('click', saveSettings);
        document.getElementById('admin-save-btn').addEventListener('click', saveAdminPassword);

        bindCollapsibleSections();
        loadSettings();
    </script>
</body>
</html>
