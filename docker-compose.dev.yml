services:
  app:
    build:
      context: .
    image: wx-coupon-backend:dev
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "${WX_DEV_HTTP_BIND:-127.0.0.1}:${WX_DEV_HTTP_PORT:-18080}:80"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      WX_SERVICE_ENV: ${WX_SERVICE_ENV:-dev}
      WX_SERVICE_DEPLOYMENT_NAME: ${WX_SERVICE_DEPLOYMENT_NAME:-wx-coupon-dev}
      WX_SERVICE_ROOT: /app
      WX_SERVICE_DATA_DIR: /data
      WX_SERVICE_CONFIG_FILE: ${WX_SERVICE_CONFIG_FILE:-}
      WX_SERVICE_RUNTIME_DIR: /run/wx_service-python
      WX_SERVICE_LOG_DIR: /logs
      WX_SERVICE_SOCKET_PATH: ""
      WX_SERVICE_AUTO_START_GO: ${WX_SERVICE_AUTO_START_GO:-true}
      GO_INTERNAL_API_SOCKET_PATH: /run/wx_service/meituan-query-internal.sock
      GO_SHORTLINK_PUBLIC_BASE_URL: ${GO_SHORTLINK_PUBLIC_BASE_URL:-http://localhost:18080}
      WX_SERVICE_REDIS_URL: ${WX_SERVICE_REDIS_URL:-redis://redis:6379/0}
      WX_SERVICE_REDIS_PASSWORD: ${WX_SERVICE_REDIS_PASSWORD:-}
      WX_SERVICE_REDIS_SOCKET_TIMEOUT_SECONDS: ${WX_SERVICE_REDIS_SOCKET_TIMEOUT_SECONDS:-1.5}
      WX_SERVICE_REDIS_HEALTH_CHECK_INTERVAL_SECONDS: ${WX_SERVICE_REDIS_HEALTH_CHECK_INTERVAL_SECONDS:-30}
      WX_PROXY_API_URL: ${WX_PROXY_API_URL:-}
      WX_ORDER_RANKINGS_LINK_SECRET: ${WX_ORDER_RANKINGS_LINK_SECRET:-}
      WX_LOGIN_FAILURE_WINDOW_SECONDS: ${WX_LOGIN_FAILURE_WINDOW_SECONDS:-900}
      WX_LOGIN_FAILURE_MAX_ATTEMPTS: ${WX_LOGIN_FAILURE_MAX_ATTEMPTS:-8}
      WX_LOGIN_LOCK_SECONDS: ${WX_LOGIN_LOCK_SECONDS:-900}
      WX_WECHAT_MAX_BODY_BYTES: ${WX_WECHAT_MAX_BODY_BYTES:-262144}
    command:
      - /bin/sh
      - -c
      - |
        chmod +x /app/meituan-query 2>/dev/null || true
        exec uvicorn main:app --host 0.0.0.0 --port 80 --reload --reload-dir /app
    volumes:
      - .:/app
      - ./runtime-data:/data
      - ./logs:/logs
      - go-dev-runtime:/run/wx_service
      - redis-dev-runtime:/run/redis
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1/healthz', timeout=2).read()\""]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p /run/redis
        chmod 777 /run/redis
        exec redis-server --appendonly yes --port 6379 --unixsocket /run/redis/redis-server.sock --unixsocketperm 777
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping && redis-cli -s /run/redis/redis-server.sock ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis-dev-data:/data
      - redis-dev-runtime:/run/redis

volumes:
  redis-dev-data:
  go-dev-runtime:
  redis-dev-runtime:
