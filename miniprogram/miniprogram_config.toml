#
# miniprogram_config.toml 使用说明
#
# TOML 语法说明：
# - 注释只能用 #。
# - 三引号字符串只能用于真正的多行配置值，比如红包链接、多行教程或多行入口集合。
#
# 主配置段（如 [gh_xxx]）通用字段说明：
# - show_dianping_links
#   true：在没有 extra_params_url 时，允许显示 dianping_links 里的备用入口。
#   false：这些备用入口不显示。
#
# - build_extra_params
#   true：尝试构建“大众点评/美团外卖”额外跳转按钮。
#   false：不构建这条额外入口，回复会更短。
#
# - show_merchant_coupon_link
#   true：显示商家券主链接。
#   false：不显示商家券主链接。
#
# - show_miniprogram_link
#   true：显示小程序直达按钮。
#   false：不显示小程序直达按钮。
#
# - show_token_null_message
#   true：当 token 为空时，额外追加提示说明。
#   false：遇到 token 为空时不显示说明。
#
# - show_save_merchant_coupon_link
#   true：显示“保存商家券”入口。
#   false：不显示这个入口。
#
# - button_name
#   额外参数按钮文字。
#   不配置：回退到默认按钮文案。
#
# - dianping_links
#   备用的大众点评入口集合。
#   配置后：在允许显示时整段发给用户。
#   留空：没有备用入口。
#
# - no_config_message
#   当前公众号没配美团功能时返回的文案。
#   不配置：回退到默认提示。
#
# - no_link_message / no_link_message_text
#   解析不到 poi_id_str 时的提示。
#   一个用于小程序收藏消息，一个用于小程序链接文本链路。
#
# - click_detail_link
#   正文前面的“点击下方链接查看详情”提示。
#   留空：这行不会显示。
#
# - merchant_coupon_link
#   商家券主按钮文案。
#
# - merchant_coupon_link_2 / merchant_coupon_link_2_suffix
#   第二条商家券按钮文案和后缀。链接由商家券主链接的 collection_waimai_v8 派生为 collection_waimai_v5。
#
# - copy_to_browser
#   额外参数按钮前的说明文字。
#   配置后：用户更容易理解为什么要点下面那个按钮。
#   留空：按钮前不加说明。
#
# - red_packet_links
#   红包入口区域。
#   配置后：正文会额外多出这一整段链接。
#   留空：不显示红包入口。
#
# - token_null_message
#   token 为空时的补充说明。
#
# - save_merchant_coupon_link_text
#   保存商家券入口的按钮文字。
#
# - cashback_activity_link_text
#   返现活动入口按钮文字。
#
# - merchant_coupon_link_suffix
#   只加在商家券主按钮后面。
#   例如：
#     merchant_coupon_link_suffix = "（先进券页，再回来看下面入口）"
#   用户会收到：
#     <a href="...">领取商家券(可切号，不一定有)</a>（先进券页，再回来看下面入口）
#
# - cashback_activity_link_suffix
#   只加在返现活动入口后面。
#   例如：
#     cashback_activity_link_suffix = "（领券前后都可以报名）"
#   用户会收到：
#     <a href="weixin://bizmsgmenu?...">点击报名该商家「官方返现」活动</a>（领券前后都可以报名）
#
# - miniprogram_link_suffix
#   只加在小程序直达链接后面。
#   例如：
#     miniprogram_link_suffix = "（网页打不开就点这里）"
#   用户会收到：
#     <a data-miniprogram-...>领取商家券 (小程序版)</a>（网页打不开就点这里）
#
# - extra_params_link_suffix
#   只加在额外参数按钮后面。
#   例如：
#     然后复制到浏览器打开：
#     <a href="...">大众点评/美团外卖</a>（需要跳大众点评时点这个）
#
# - save_merchant_coupon_link_suffix
#   只加在保存商家券入口后面。
#   例如：
#     <a href="weixin://bizmsgmenu?...">保存商家券</a>（下次不用重新找店）
#   这几个 suffix 留空时，对应链接都不会追加任何内容，也不会多空格或换行。
#
# - default_title
#   正文标题，比如“美团商家”。
#
# - miniprogram_open_prefix
#   小程序直达按钮的按钮文字。
#
# merchant_coupon_view 段说明：
# - 这些段是“用户保存后的商家券查看场景”专用配置。
# - 字段语义与主配置段相同；只是在“查看已保存商家券”这条链路里生效。
#
# 小程序处理配置
