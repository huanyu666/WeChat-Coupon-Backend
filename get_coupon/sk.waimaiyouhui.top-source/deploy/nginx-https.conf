server {
    listen 80;
    listen [::]:80;
    server_name sk.waimaiyouhui.top;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/skill;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name sk.waimaiyouhui.top;

    ssl_certificate /etc/letsencrypt/live/sk.waimaiyouhui.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sk.waimaiyouhui.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:3188;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
}
