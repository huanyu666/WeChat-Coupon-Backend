<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>组队数据管理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/web/static/css/admin_glass.css">
    <style>
        .action-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
    </style>
</head>
<body class="admin-glass-page">
    <div class="admin-shell">
        <div class="bg-shape shape-1"></div>
        <div class="bg-shape shape-2"></div>
        <div class="bg-shape shape-3"></div>
        <div class="admin-page">
        <section class="glass-card admin-hero">
            <span class="admin-kicker">组队工具</span>
            <h1 class="admin-title">组队数据管理</h1>
            <p class="admin-subtitle">统一查看大厅记录、筛选异常数据，并对发布内容、IP 与联系方式做清理维护。</p>
        </section>

        <!-- 筛选区域 -->
        <section class="card filter-section admin-card">
            <div class="card-body">
                <div class="admin-section-head">
                    <div>
                        <h2 class="admin-section-title">筛选条件</h2>
                        <div class="admin-section-note">按类型、IP、联系方式和分数定位需要处理的记录。</div>
                    </div>
                </div>
                <form id="filterForm" class="row g-3">
                    <div class="col-md-2">
                        <label class="form-label">类型</label>
                        <select class="form-select" name="type">
                            <option value="">全部</option>
                            <option value="1">队伍缺人</option>
                            <option value="2">散人找队</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">IP地址</label>
                        <input type="text" class="form-control" name="ip" placeholder="筛选IP">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">联系方式</label>
                        <input type="text" class="form-control" name="contact" placeholder="筛选联系方式">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">分数</label>
                        <input type="number" class="form-control" name="score" placeholder="筛选分数">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">每页条数</label>
                        <select class="form-select" name="page_size">
                            <option value="20">20</option>
                            <option value="50">50</option>
                            <option value="100">100</option>
                        </select>
                    </div>
                    <div class="col-md-2 d-flex align-items-end">
                        <button type="submit" class="btn btn-primary w-100">查询</button>
                    </div>
                </form>
            </div>
        </section>

        <!-- 导航 -->
        <ul class="nav nav-tabs admin-nav glass-card">
            <li class="nav-item">
                <a class="nav-link active" href="/web/admin-zudui/">数据管理</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/web/admin-zudui/ipban">IP封禁管理</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/web/admin-zudui/ip-count">IP插入统计</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/web/admin-zudui/ip-delete-count">IP删除统计</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/web/admin-zudui/contact-count">重复联系方式</a>
            </li>
        </ul>

        <!-- 操作按钮区域 -->
        <section class="card admin-card">
            <div class="card-body">
                <div class="admin-section-head">
                    <div>
                        <h2 class="admin-section-title">批量操作</h2>
                        <div class="admin-section-note">支持按条件批量删除、垃圾数据清理、去重和按时间归档。</div>
                    </div>
                </div>
                <div class="action-buttons">
                <button class="btn btn-danger" onclick="deleteSelected()">批量删除选中</button>
                <button class="btn btn-warning" onclick="deleteSpam()">一键删除垃圾数据</button>
                <button class="btn btn-info" onclick="queryBannedIP()">查询封禁IP数据</button>
                <button class="btn btn-warning" onclick="querySuspectedSpam()">查询疑似垃圾数据</button>
                <button class="btn btn-danger" onclick="deleteByFilter()">按查询条件删除全部</button>
                <button class="btn btn-success" onclick="deduplicate()">去重（分数+联系方式）</button>
                <button class="btn btn-danger" onclick="deleteUnknownContactType()">删除未知联系方式类型且空白IP</button>
                <button class="btn btn-secondary" onclick="deleteByDate(7)">删除7天前数据</button>
                <div class="input-group mt-2" style="max-width: 300px;">
                    <input type="number" class="form-control" id="daysInput" placeholder="天数" value="7" min="1">
                    <button class="btn btn-outline-secondary" onclick="deleteByDateCustom()">删除N天前数据</button>
                </div>
            </div>
            </div>
        </section>

        <!-- 数据表格 -->
        <section class="card admin-card">
            <div class="card-body">
                <div class="admin-section-head">
                    <div>
                        <h2 class="admin-section-title">记录列表</h2>
                        <div class="admin-section-note">保留分页浏览和逐条操作能力，便于快速处理异常。</div>
                    </div>
                </div>
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th>
                                    <input type="checkbox" id="selectAll" onchange="toggleSelectAll()">
                                </th>
                                <th>ID</th>
                                <th>类型</th>
                                <th>分数</th>
                                <th>联系方式</th>
                                <th>联系方式类型</th>
                                <th>IP地址</th>
                                <th>创建时间</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="dataTable">
                            <tr>
                                <td colspan="9" class="text-center">加载中...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- 分页 -->
                <nav>
                    <ul class="pagination justify-content-center" id="pagination">
                    </ul>
                </nav>

                <div class="pagination-info text-center">
                    <span id="paginationInfo"></span>
                </div>
            </div>
        </section>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let currentPage = 1;
        let totalPages = 1;
        let pageSize = 20;
        let selectedIds = new Set();
        let currentQueryType = 'normal'; // 'normal' 或 'banned-ip'

        // 加载数据
        function loadData(page = 1) {
            currentQueryType = 'normal'; // 标记为普通查询
            currentPage = toPositiveInt(page, 1);
            const formData = new FormData(document.getElementById('filterForm'));
            const params = new URLSearchParams();
            
            pageSize = toPositiveInt(formData.get('page_size') || '20', 20);
            params.append('page', currentPage);
            params.append('page_size', pageSize);
            document.querySelector('#filterForm [name="page_size"]').value = String(pageSize);
            
            if (formData.get('type')) params.append('type', formData.get('type'));
            if (formData.get('ip')) params.append('ip', formData.get('ip'));
            if (formData.get('contact')) params.append('contact', formData.get('contact'));
            if (formData.get('score')) params.append('score', formData.get('score'));

            fetch(`/web/api/admin/zudui/list?${params.toString()}`)
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'success') {
                        renderTable(data.data);
                        totalPages = Math.max(1, Math.ceil(toSafeInt(data.total, 0) / pageSize));
                        renderPagination(toSafeInt(data.total, 0), toPositiveInt(data.page, currentPage), pageSize);
                        selectedIds.clear();
                        updateSelectAllCheckbox();
                    } else {
                        alert('加载失败: ' + data.msg);
                    }
                })
                .catch(err => {
                    console.error('Error:', err);
                    alert('加载失败');
                });
        }

        // 渲染表格
        function renderTable(records) {
            const tbody = document.getElementById('dataTable');
            if (records.length === 0) {
                tbody.innerHTML = '<tr><td colspan="9" class="text-center">暂无数据</td></tr>';
                return;
            }

            tbody.innerHTML = records.map(record => {
                const id = toSafeInt(record.id, -1);
                const score = toSafeInt(record.score, 0);
                const contact = escapeHtml(record.contact);
                const contactType = escapeHtml(record.contact_type);
                const ipAddress = escapeHtml(record.ip_address || '');
                const timeAgo = escapeHtml(record.time_ago || '');
                const createdAt = formatDateTime(record.created_at);
                const typeText = record.type === 1 ? '队伍缺人' : '散人找队';
                return `
                <tr>
                    <td>
                        <input type="checkbox" class="row-checkbox" value="${id}" onchange="toggleRow(${id})">
                    </td>
                    <td>${id}</td>
                    <td>${typeText}</td>
                    <td>${score}</td>
                    <td>${contact}</td>
                    <td>${contactType}</td>
                    <td>${ipAddress}</td>
                    <td>${createdAt}<br><small class="text-muted">${timeAgo}</small></td>
                    <td>
                        <button class="btn btn-sm btn-danger" onclick="deleteRecord(${id})">删除</button>
                    </td>
                </tr>`;
            }).join('');
        }

        // 渲染分页
        function renderPagination(total, page, pageSize) {
            const pagination = document.getElementById('pagination');
            const info = document.getElementById('paginationInfo');
            
            info.textContent = `共 ${total} 条记录，第 ${page} / ${totalPages} 页`;

            // 根据当前查询类型决定调用哪个函数
            let loadFunction = 'loadData';
            if (currentQueryType === 'banned-ip') {
                loadFunction = 'loadBannedIPData';
            } else if (currentQueryType === 'suspected-spam') {
                loadFunction = 'loadSuspectedSpamData';
            }

            let html = '';
            // 上一页
            html += `<li class="page-item ${page <= 1 ? 'disabled' : ''}">
                <a class="page-link" href="#" onclick="${loadFunction}(${page - 1}); return false;">上一页</a>
            </li>`;

            // 页码
            const startPage = Math.max(1, page - 2);
            const endPage = Math.min(totalPages, page + 2);
            
            if (startPage > 1) {
                html += `<li class="page-item"><a class="page-link" href="#" onclick="${loadFunction}(1); return false;">1</a></li>`;
                if (startPage > 2) {
                    html += `<li class="page-item disabled"><span class="page-link">...</span></li>`;
                }
            }

            for (let i = startPage; i <= endPage; i++) {
                html += `<li class="page-item ${i === page ? 'active' : ''}">
                    <a class="page-link" href="#" onclick="${loadFunction}(${i}); return false;">${i}</a>
                </li>`;
            }

            if (endPage < totalPages) {
                if (endPage < totalPages - 1) {
                    html += `<li class="page-item disabled"><span class="page-link">...</span></li>`;
                }
                html += `<li class="page-item"><a class="page-link" href="#" onclick="${loadFunction}(${totalPages}); return false;">${totalPages}</a></li>`;
            }

            // 下一页
            html += `<li class="page-item ${page >= totalPages ? 'disabled' : ''}">
                <a class="page-link" href="#" onclick="${loadFunction}(${page + 1}); return false;">下一页</a>
            </li>`;

            pagination.innerHTML = html;
        }

        // 全选/取消全选
        function toggleSelectAll() {
            const selectAll = document.getElementById('selectAll');
            const checkboxes = document.querySelectorAll('.row-checkbox');
            checkboxes.forEach(cb => {
                cb.checked = selectAll.checked;
                const id = toSafeInt(cb.value, -1);
                if (selectAll.checked) {
                    if (id > 0) selectedIds.add(id);
                } else {
                    selectedIds.delete(id);
                }
            });
        }

        // 更新全选复选框状态
        function updateSelectAllCheckbox() {
            const selectAll = document.getElementById('selectAll');
            const checkboxes = document.querySelectorAll('.row-checkbox');
            const checkedCount = Array.from(checkboxes).filter(cb => cb.checked).length;
            selectAll.checked = checkboxes.length > 0 && checkedCount === checkboxes.length;
            selectAll.indeterminate = checkedCount > 0 && checkedCount < checkboxes.length;
        }

        // 切换单行选择
        function toggleRow(id) {
            const safeId = toSafeInt(id, -1);
            if (safeId <= 0) return;
            const checkbox = document.querySelector(`.row-checkbox[value="${safeId}"]`);
            if (!checkbox) return;
            if (checkbox.checked) {
                selectedIds.add(safeId);
            } else {
                selectedIds.delete(safeId);
            }
            updateSelectAllCheckbox();
        }

        // 删除单条记录
        function deleteRecord(id) {
            if (!confirm('确定要删除这条记录吗？')) return;
            deleteRecords([id]);
        }

        // 批量删除选中
        function deleteSelected() {
            if (selectedIds.size === 0) {
                alert('请先选择要删除的记录');
                return;
            }
            if (!confirm(`确定要删除选中的 ${selectedIds.size} 条记录吗？`)) return;
            deleteRecords(Array.from(selectedIds));
        }

        // 删除记录
        function deleteRecords(ids) {
            const safeIds = (Array.isArray(ids) ? ids : []).map(id => toSafeInt(id, -1)).filter(id => id > 0);
            if (safeIds.length === 0) {
                alert('未选择有效记录');
                return;
            }
            fetch('/web/api/admin/zudui/delete', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ ids: safeIds })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    alert(data.msg);
                    // 根据当前查询类型决定刷新哪个数据源
                    if (currentQueryType === 'banned-ip') {
                        loadBannedIPData(currentPage);
                    } else if (currentQueryType === 'suspected-spam') {
                        loadSuspectedSpamData(currentPage);
                    } else {
                        loadData(currentPage);
                    }
                } else {
                    alert('删除失败: ' + data.msg);
                }
            })
            .catch(err => {
                console.error('Error:', err);
                alert('删除失败');
            });
        }

        // 删除垃圾数据
        function deleteSpam() {
            if (!confirm('确定要删除所有垃圾数据吗？此操作不可恢复！')) return;
            fetch('/web/api/admin/zudui/delete-spam', {
                method: 'POST'
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    alert(data.msg);
                    loadData(currentPage);
                } else {
                    alert('删除失败: ' + data.msg);
                }
            })
            .catch(err => {
                console.error('Error:', err);
                alert('删除失败');
            });
        }

        // 按日期删除
        function deleteByDate(days) {
            const safeDays = toPositiveInt(days, 1);
            if (!confirm(`确定要删除 ${safeDays} 天前的所有数据吗？此操作不可恢复！`)) return;
            fetch('/web/api/admin/zudui/delete-by-date', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ days: safeDays })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    alert(data.msg);
                    loadData(currentPage);
                } else {
                    alert('删除失败: ' + data.msg);
                }
            })
            .catch(err => {
                console.error('Error:', err);
                alert('删除失败');
            });
        }

        // 自定义天数删除
        function deleteByDateCustom() {
            const days = toPositiveInt(document.getElementById('daysInput').value, 0);
            if (days < 1) {
                alert('请输入有效的天数');
                return;
            }
            document.getElementById('daysInput').value = String(days);
            deleteByDate(days);
        }

        // 工具函数
        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, function(char) {
                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#39;'
                }[char];
            });
        }

        function escapeAttr(value) {
            return escapeHtml(value).replace(/`/g, '&#96;');
        }

        function toSafeInt(value, fallback = 0) {
            const number = Number.parseInt(value, 10);
            return Number.isFinite(number) ? number : fallback;
        }

        function toPositiveInt(value, fallback = 1) {
            const number = toSafeInt(value, fallback);
            return number > 0 ? number : fallback;
        }

        function formatDateTime(dateStr) {
            if (!dateStr) return '';
            const date = new Date(dateStr);
            return date.toLocaleString('zh-CN');
        }

        // 表单提交
        document.getElementById('filterForm').addEventListener('submit', function(e) {
            e.preventDefault();
            loadData(1);
        });

        // 查询封禁IP数据
        function queryBannedIP() {
            // 切换到封禁IP数据查询
            loadBannedIPData(1);
        }

        function querySuspectedSpam() {
            // 切换到疑似垃圾数据查询
            loadSuspectedSpamData(1);
        }

        // 加载疑似垃圾数据
        function loadSuspectedSpamData(page = 1) {
            currentQueryType = 'suspected-spam'; // 标记为疑似垃圾数据查询
            currentPage = toPositiveInt(page, 1);
            const params = new URLSearchParams();
            params.append('page', currentPage);
            params.append('page_size', pageSize);

            fetch(`/web/api/admin/zudui/suspected-spam?${params.toString()}`)
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'success') {
                        renderTable(data.data);
                        totalPages = Math.max(1, Math.ceil(toSafeInt(data.total, 0) / pageSize));
                        renderPagination(toSafeInt(data.total, 0), toPositiveInt(data.page, currentPage), pageSize);
                        selectedIds.clear();
                        updateSelectAllCheckbox();
                        if (currentPage === 1) {
                            alert(`找到 ${toSafeInt(data.total, 0)} 条疑似垃圾数据`);
                        }
                    } else {
                        alert('查询失败: ' + data.msg);
                    }
                })
                .catch(err => {
                    console.error('Error:', err);
                    alert('查询失败');
                });
        }

        // 加载封禁IP数据
        function loadBannedIPData(page = 1) {
            currentQueryType = 'banned-ip'; // 标记为封禁IP查询
            currentPage = toPositiveInt(page, 1);
            const params = new URLSearchParams();
            params.append('page', currentPage);
            params.append('page_size', pageSize);

            fetch(`/web/api/admin/zudui/banned-ip?${params.toString()}`)
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'success') {
                        renderTable(data.data);
                        totalPages = Math.max(1, Math.ceil(toSafeInt(data.total, 0) / pageSize));
                        renderPagination(toSafeInt(data.total, 0), toPositiveInt(data.page, currentPage), pageSize);
                        selectedIds.clear();
                        updateSelectAllCheckbox();
                        if (currentPage === 1) {
                            alert(`找到 ${toSafeInt(data.total, 0)} 条封禁IP提交的数据`);
                        }
                    } else {
                        alert('查询失败: ' + data.msg);
                    }
                })
                .catch(err => {
                    console.error('Error:', err);
                    alert('查询失败');
                });
        }

        // 按查询条件删除全部
        function deleteByFilter() {
            if (!confirm('确定要删除符合当前查询条件的所有数据吗？此操作不可恢复！')) return;
            
            const formData = new FormData(document.getElementById('filterForm'));
            const params = new URLSearchParams();
            
            if (formData.get('type')) params.append('type', formData.get('type'));
            if (formData.get('ip')) params.append('ip', formData.get('ip'));
            if (formData.get('contact')) params.append('contact', formData.get('contact'));
            if (formData.get('score')) params.append('score', formData.get('score'));

            fetch(`/web/api/admin/zudui/delete-by-filter?${params.toString()}`, {
                method: 'POST'
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    alert(data.msg);
                    loadData(1);
                } else {
                    alert('删除失败: ' + data.msg);
                }
            })
            .catch(err => {
                console.error('Error:', err);
                alert('删除失败');
            });
        }

        // 去重功能：分数和联系方式相同时只保留最新的那个
        function deduplicate() {
            if (!confirm('确定要去重吗？对于分数和联系方式相同的记录，将只保留最新的一条，其他重复记录将被删除。此操作不可恢复！')) return;
            
            fetch('/web/api/admin/zudui/deduplicate', {
                method: 'POST'
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    alert(data.msg);
                    loadData(1);
                } else {
                    alert('去重失败: ' + data.msg);
                }
            })
            .catch(err => {
                console.error('Error:', err);
                alert('去重失败');
            });
        }

        // 删除未知联系方式类型且空白IP的记录
        function deleteUnknownContactType() {
            if (!confirm('确定要删除所有联系方式类型为"未知"或空，且IP地址为空的记录吗？此操作不可恢复！')) return;
            
            fetch('/web/api/admin/zudui/delete-unknown-contact-type', {
                method: 'POST'
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    alert(data.msg);
                    loadData(1);
                } else {
                    alert('删除失败: ' + data.msg);
                }
            })
            .catch(err => {
                console.error('Error:', err);
                alert('删除失败');
            });
        }

        // 初始化加载
        loadData(1);
    </script>
</body>
</html>
