<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>外卖羊毛王 · 登录注册</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/web/static/css/theme.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
            overflow: hidden;
            background:
                radial-gradient(circle at top left, rgba(125, 211, 252, 0.78), transparent 28%),
                radial-gradient(circle at bottom right, rgba(153, 246, 228, 0.8), transparent 30%),
                radial-gradient(circle at 55% 38%, rgba(196, 181, 253, 0.34), transparent 24%),
                #e2e8f0;
        }

        .floating-element {
            position: absolute;
            z-index: 0;
            color: rgba(255, 255, 255, 0.34);
            animation: float 15s infinite ease-in-out;
            pointer-events: none;
        }

        .heart { font-size: 30px; }
        .star { font-size: 24px; }
        .sparkle { font-size: 20px; }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-26px) rotate(8deg); }
        }

        .login-container {
            width: 100%;
            max-width: 460px;
            padding: 34px 32px 30px;
            position: relative;
            z-index: 1;
            overflow: hidden;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.46);
            border: 1px solid rgba(255, 255, 255, 0.56);
            border-top-color: rgba(255, 255, 255, 0.84);
            border-left-color: rgba(255, 255, 255, 0.84);
            box-shadow: 0 24px 60px rgba(15, 23, 42, 0.12);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
        }

        .neon-border {
            display: none;
        }

        .logo-section {
            margin-bottom: 28px;
            text-align: left;
        }

        .logo-icon {
            width: 68px;
            height: 68px;
            margin: 0 0 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.76);
            background: linear-gradient(135deg, #38bdf8, #2563eb);
            box-shadow: 0 18px 36px rgba(37, 99, 235, 0.18);
        }

        .logo-icon::before {
            display: none;
        }

        .logo-icon i {
            color: #fff;
            font-size: 28px;
        }

        .logo-title {
            display: block;
            font-size: 28px;
            line-height: 1.1;
            color: #1e293b;
        }

        .logo-subtitle {
            margin-top: 10px;
            color: #64748b;
            font-size: 14px;
            letter-spacing: 0;
        }

        .form-container {
            position: relative;
        }

        .tab-header {
            display: flex;
            margin-bottom: 26px;
            padding: 4px;
            border-radius: 14px;
            border: 1px solid rgba(148, 163, 184, 0.2);
            background: rgba(255, 255, 255, 0.4);
        }

        .tab-item {
            flex: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 14px;
            color: #64748b;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.2s ease, color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
        }

        .tab-item.active {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #fff;
            box-shadow: 0 10px 22px rgba(37, 99, 235, 0.2);
        }

        .auth-form {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .input-icon {
            position: relative;
        }

        .input-icon i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            z-index: 1;
            font-size: 16px;
            transition: color 0.2s ease, transform 0.2s ease;
        }

        .layui-input {
            width: 100%;
            height: 52px;
            padding: 14px 16px 14px 46px;
            line-height: 22px;
            border: 1px solid rgba(148, 163, 184, 0.24);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.74);
            color: #1e293b;
            font-size: 15px;
            box-shadow: inset 0 1px 2px rgba(15, 23, 42, 0.03);
            transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }

        .layui-input::placeholder {
            color: #94a3b8;
        }

        .layui-input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.9);
            border-color: rgba(37, 99, 235, 0.42);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
        }

        #captchaImage,
        #loginCaptchaImage {
            height: 52px !important;
            border-radius: 12px !important;
            border: 1px solid rgba(148, 163, 184, 0.24) !important;
            background: rgba(255, 255, 255, 0.76);
            box-shadow: inset 0 1px 2px rgba(15, 23, 42, 0.03);
        }

        .submit-btn {
            width: 100%;
            height: 52px;
            margin-top: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
        }

        .submit-btn::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transform: translateX(-100%);
            transition: transform 0.5s ease;
        }

        .submit-btn:hover::before {
            transform: translateX(100%);
        }

        .submit-btn:hover {
            transform: translateY(-1px);
        }

        .submit-btn:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }

        .login-btn {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            box-shadow: 0 16px 34px rgba(37, 99, 235, 0.2);
        }

        .login-btn:hover {
            box-shadow: 0 20px 40px rgba(37, 99, 235, 0.24);
        }

        .register-btn {
            background: linear-gradient(135deg, #0f766e, #115e59);
            box-shadow: 0 16px 34px rgba(15, 118, 110, 0.18);
        }

        .register-btn:hover {
            box-shadow: 0 20px 40px rgba(15, 118, 110, 0.22);
        }

        .btn-loading {
            display: none;
            font-size: 18px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .input-success {
            animation: inputSuccess 0.45s ease;
        }

        @keyframes inputSuccess {
            0% { transform: scale(1); }
            50% { transform: scale(1.01); }
            100% { transform: scale(1); }
        }

        @keyframes messageSlideIn {
            from {
                transform: translate(-50%, -56%);
                opacity: 0;
            }
            to {
                transform: translate(-50%, -50%);
                opacity: 1;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 16px;
            }

            .login-container {
                padding: 28px 22px 24px;
                border-radius: 20px;
            }

            .logo-title {
                font-size: 24px;
            }

            .logo-icon {
                width: 60px;
                height: 60px;
                margin-bottom: 16px;
            }

            .logo-icon i {
                font-size: 24px;
            }

            .tab-item {
                padding: 11px 12px;
                font-size: 13px;
            }

            .layui-input,
            .submit-btn,
            #captchaImage,
            #loginCaptchaImage {
                height: 50px !important;
            }
        }
    </style>
</head>
<body>
<div class="floating-element heart" style="top: 10%; left: 5%;"><i class="fas fa-heart"></i></div>
<div class="floating-element star" style="top: 15%; right: 8%; animation-delay: 1s;"><i class="fas fa-star"></i></div>
<div class="floating-element sparkle" style="bottom: 20%; left: 10%; animation-delay: 2s;"><i class="fas fa-sparkles"></i></div>
<div class="floating-element heart" style="bottom: 15%; right: 12%; animation-delay: 3s;"><i class="fas fa-heart"></i></div>
<div class="floating-element star" style="top: 40%; right: 5%; animation-delay: 4s;"><i class="fas fa-star"></i></div>
<div class="floating-element sparkle" style="top: 60%; left: 8%; animation-delay: 5s;"><i class="fas fa-sparkles"></i></div>

<div class="login-container">
    <div class="neon-border"></div>

    <div class="logo-section">
        <div class="logo-icon">
            <i class="fas fa-crown"></i>
        </div>
        <h1 class="logo-title">公众号：外卖羊毛王</h1>
        <p class="logo-subtitle">订单查询与账户管理工作台</p>
    </div>

    <div class="form-container">
        <div class="tab-header">
            <div class="tab-item active" data-tab="login">
                <i class="fas fa-sign-in-alt"></i> 登录
            </div>
            <div class="tab-item" data-tab="register">
                <i class="fas fa-user-plus"></i> 注册
            </div>
        </div>

        <form id="loginForm" class="auth-form">
            <div class="form-group">
                <div class="input-icon">
                    <i class="fas fa-user-circle"></i>
                    <input type="text" name="username" placeholder="请输入用户名" class="layui-input" required>
                </div>
            </div>

            <div class="form-group">
                <div class="input-icon">
                    <i class="fas fa-lock"></i>
                    <input type="password" name="password" placeholder="请输入密码" class="layui-input" required>
                </div>
            </div>

            <div class="form-group">
                <div style="display: flex; gap: 10px; align-items: center;">
                    <div class="input-icon" style="flex: 1;">
                        <i class="fas fa-shield-alt"></i>
                        <input type="text" name="captcha" placeholder="请输入验证码" class="layui-input" required style="text-transform: uppercase;">
                    </div>
                    <img id="loginCaptchaImage" src="/web/api/captcha" alt="验证码" style="height: 55px; cursor: pointer; border-radius: 12px; border: 1px solid rgba(148, 163, 184, 0.24);" title="点击刷新验证码">
                </div>
            </div>

            <button type="submit" class="submit-btn login-btn">
                <span class="btn-text">登录系统</span>
                <span class="btn-loading fas fa-spinner"></span>
            </button>
        </form>

        <form id="registerForm" class="auth-form" style="display: none;">
            <div class="form-group">
                <div class="input-icon">
                    <i class="fas fa-user-circle"></i>
                    <input type="text" name="username" placeholder="请输入用户名" class="layui-input" required>
                </div>
            </div>

            <div class="form-group">
                <div class="input-icon">
                    <i class="fas fa-lock"></i>
                    <input type="password" name="password" placeholder="请输入密码" class="layui-input" required>
                </div>
            </div>

            <div class="form-group">
                <div class="input-icon">
                    <i class="fas fa-lock"></i>
                    <input type="password" name="repassword" placeholder="请确认密码" class="layui-input" required>
                </div>
            </div>

            <div class="form-group">
                <div style="display: flex; gap: 10px; align-items: center;">
                    <div class="input-icon" style="flex: 1;">
                        <i class="fas fa-shield-alt"></i>
                        <input type="text" name="captcha" placeholder="请输入验证码" class="layui-input" required style="text-transform: uppercase;">
                    </div>
                    <img id="captchaImage" src="/web/api/captcha" alt="验证码" style="height: 55px; cursor: pointer; border-radius: 12px; border: 1px solid rgba(148, 163, 184, 0.24);" title="点击刷新验证码">
                </div>
            </div>

            <button type="submit" class="submit-btn register-btn">
                <span class="btn-text">注册账号</span>
                <span class="btn-loading fas fa-spinner"></span>
            </button>
        </form>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/layui/2.9.8/layui.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
<script>
    
    function hashPassword(password) {
        return CryptoJS.SHA256(password).toString();
    }
    
    layui.use(['layer', 'form'], function(){
        var layer = layui.layer;
        var $ = layui.jquery;

        
        function createFloatingElements() {
            const container = document.body;
            const types = ['heart', 'star', 'sparkle'];

            for (let i = 0; i < 15; i++) {
                const elem = document.createElement('div');
                const type = types[Math.floor(Math.random() * types.length)];
                elem.className = `floating-element ${type}`;
                elem.innerHTML = `<i class="fas fa-${type === 'heart' ? 'heart' : type === 'star' ? 'star' : 'sparkles'}"></i>`;

                
                elem.style.left = Math.random() * 90 + 5 + '%';
                elem.style.top = Math.random() * 90 + 5 + '%';

                
                elem.style.animationDelay = Math.random() * 8 + 's';
                elem.style.animationDuration = (Math.random() * 15 + 10) + 's';

                container.appendChild(elem);
            }
        }

        createFloatingElements();

        
        $('.tab-item').on('click', function() {
            var tab = $(this).data('tab');

            $('.tab-item').removeClass('active');
            $(this).addClass('active');

            if (tab == 'login') {
                $('#loginForm').show();
                $('#registerForm').hide();
            } else {
                $('#loginForm').hide();
                $('#registerForm').show();
            }

            
            $(this).css('transform', 'scale(0.95)');
            setTimeout(() => {
                $(this).css('transform', 'translateY(-2px)');
            }, 150);
        });

        
        $('.layui-input').on('input', function() {
            if ($(this).val().trim() !== '') {
                $(this).addClass('input-success');
                setTimeout(() => {
                    $(this).removeClass('input-success');
                }, 500);
            }
        });

        
        $('.layui-input').on('focus', function() {
            $(this).parent().find('i').css({
                'color': '#2563eb',
                'transform': 'translateY(-50%) scale(1.3)'
            });
        }).on('blur', function() {
            $(this).parent().find('i').css({
                'color': '#64748b',
                'transform': 'translateY(-50%) scale(1)'
            });
        });

        
        $('#loginForm').on('submit', function(e) {
            e.preventDefault();
            var $btn = $('.login-btn');
            var $text = $btn.find('.btn-text');
            var $loading = $btn.find('.btn-loading');

            var username = $(this).find('input[name="username"]').val();
            var password = $(this).find('input[name="password"]').val();
            var captcha = $(this).find('input[name="captcha"]').val().trim().toUpperCase();

            if (!username || !password || !captcha) {
                showMessage('请填写完整信息哦~', 'error');
                return;
            }
            
            
            if (!loginCaptchaID) {
                showMessage('验证码已过期，正在刷新...', 'error');
                refreshLoginCaptcha();
                
                var retryCount = 0;
                var maxRetries = 20; 
                var checkInterval = setInterval(function() {
                    retryCount++;
                    if (loginCaptchaID) {
                        clearInterval(checkInterval);
                        showMessage('验证码已刷新，请重新输入验证码', 'success');
                        
                    } else if (retryCount >= maxRetries) {
                        clearInterval(checkInterval);
                        showMessage('获取验证码失败，请点击图片刷新', 'error');
                    }
                }, 300);
                return;
            }

            $text.hide();
            $loading.show();
            $btn.prop('disabled', true);

            
            $.ajax({
                url: '/web/api/login',
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({
                    username: username,
                    password: hashPassword(password),
                    captcha_id: loginCaptchaID,
                    captcha: captcha
                }),
                success: function(response) {
                    showMessage('登录成功！欢迎回家~', 'success', function() {
                        
                        setTimeout(function() {
                            window.location.href = '/web/query';
                        }, 100);
                    });
                },
                error: function(xhr) {
                    var errorMsg = '登录失败，请重试~';
                    if (xhr.responseJSON && xhr.responseJSON.error) {
                        errorMsg = xhr.responseJSON.error;
                    }
                    showMessage(errorMsg, 'error');
                    $text.show();
                    $loading.hide();
                    $btn.prop('disabled', false);
                    refreshLoginCaptcha();
                }
            });
        });

        
        var currentCaptchaID = '';
        var loginCaptchaID = '';
        
        function refreshCaptcha() {
            var img = $('#captchaImage');
            
            img.css('opacity', '0.5');
            
            
            var xhr = new XMLHttpRequest();
            xhr.open('GET', '/web/api/captcha?t=' + new Date().getTime(), true);
            xhr.responseType = 'blob';
            
            xhr.onload = function() {
                if (xhr.status === 200) {
                    
                    var captchaId = xhr.getResponseHeader('X-Captcha-ID') || 
                                   xhr.getResponseHeader('x-captcha-id') ||
                                   xhr.getResponseHeader('X-Captcha-Id');
                    
                    if (captchaId) {
                        currentCaptchaID = captchaId.trim();
                        console.log('注册验证码ID已获取:', currentCaptchaID);
                    } else {
                        console.error('无法获取验证码ID');
                    }
                    
                    
                    var url = URL.createObjectURL(xhr.response);
                    
                    if (img.data('blob-url')) {
                        URL.revokeObjectURL(img.data('blob-url'));
                    }
                    img.data('blob-url', url);
                    img.attr('src', url);
                    img.css('opacity', '1');
                } else {
                    img.css('opacity', '1');
                    alert('获取验证码失败，请刷新页面重试');
                }
            };
            
            xhr.onerror = function() {
                img.css('opacity', '1');
                alert('获取验证码失败，请刷新页面重试');
            };
            
            xhr.send();
        }
        
        function refreshLoginCaptcha() {
            var img = $('#loginCaptchaImage');
            
            img.css('opacity', '0.5');
            
            
            var xhr = new XMLHttpRequest();
            xhr.open('GET', '/web/api/captcha?t=' + new Date().getTime(), true);
            xhr.responseType = 'blob';
            
            xhr.onload = function() {
                if (xhr.status === 200) {
                    
                    var captchaId = xhr.getResponseHeader('X-Captcha-ID') || 
                                   xhr.getResponseHeader('x-captcha-id') ||
                                   xhr.getResponseHeader('X-Captcha-Id');
                    
                    if (captchaId) {
                        loginCaptchaID = captchaId.trim();
                        console.log('登录验证码ID已获取:', loginCaptchaID);
                    } else {
                        console.error('无法获取验证码ID');
                    }
                    
                    
                    var url = URL.createObjectURL(xhr.response);
                    
                    if (img.data('blob-url')) {
                        URL.revokeObjectURL(img.data('blob-url'));
                    }
                    img.data('blob-url', url);
                    img.attr('src', url);
                    img.css('opacity', '1');
                } else {
                    img.css('opacity', '1');
                    alert('获取验证码失败，请刷新页面重试');
                }
            };
            
            xhr.onerror = function() {
                img.css('opacity', '1');
                alert('获取验证码失败，请刷新页面重试');
            };
            
            xhr.send();
        }
        
        
        $(document).ready(function() {
            $(document).on('click', '#captchaImage', function(e) {
                e.preventDefault();
                e.stopPropagation();
                console.log('点击注册验证码图片');
                refreshCaptcha();
                return false;
            });
            
            $(document).on('click', '#loginCaptchaImage', function(e) {
                e.preventDefault();
                e.stopPropagation();
                console.log('点击登录验证码图片');
                refreshLoginCaptcha();
                return false;
            });
            
            
            $('#captchaImage').on('click', function(e) {
                e.preventDefault();
                console.log('直接绑定：点击注册验证码图片');
                refreshCaptcha();
                return false;
            });
            
            $('#loginCaptchaImage').on('click', function(e) {
                e.preventDefault();
                console.log('直接绑定：点击登录验证码图片');
                refreshLoginCaptcha();
                return false;
            });
        });
        
        
        refreshCaptcha();
        refreshLoginCaptcha();

        
        $('#registerForm').on('submit', function(e) {
            e.preventDefault();
            var $btn = $('.register-btn');
            var $text = $btn.find('.btn-text');
            var $loading = $btn.find('.btn-loading');

            var username = $(this).find('input[name="username"]').val();
            var password = $(this).find('input[name="password"]').val();
            var repassword = $(this).find('input[name="repassword"]').val();
            var captcha = $(this).find('input[name="captcha"]').val();

            if (!username || !password || !repassword || !captcha) {
                showMessage('请填写完整信息哦~', 'error');
                return;
            }
            
            
            if (!currentCaptchaID) {
                showMessage('验证码已过期，正在刷新...', 'error');
                refreshCaptcha();
                
                setTimeout(function() {
                    if (!currentCaptchaID) {
                        showMessage('获取验证码失败，请点击图片刷新', 'error');
                    }
                }, 1000);
                return;
            }

            if (password !== repassword) {
                showMessage('两次密码不一致，检查一下~', 'error');
                return;
            }

            $text.hide();
            $loading.show();
            $btn.prop('disabled', true);

            
            $.ajax({
                url: '/web/api/register',
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({
                    username: username,
                    password: hashPassword(password),
                    captcha_id: currentCaptchaID,
                    captcha: captcha
                }),
                success: function(response) {
                    showMessage('注册成功！请等待管理员审核~', 'success', function() {
                        
                        $('.tab-item[data-tab="login"]').click();
                        $('#loginForm input[name="username"]').val(username);
                        $('#loginForm input[name="password"]').val('');
                        $text.show();
                        $loading.hide();
                        $btn.prop('disabled', false);
                        $('#registerForm')[0].reset();
                        refreshCaptcha();
                    });
                },
                error: function(xhr) {
                    var errorMsg = '注册失败，请重试~';
                    if (xhr.responseJSON && xhr.responseJSON.error) {
                        errorMsg = xhr.responseJSON.error;
                    }
                    showMessage(errorMsg, 'error');
                    $text.show();
                    $loading.hide();
                    $btn.prop('disabled', false);
                    refreshCaptcha();
                }
            });
        });

        
        function showMessage(msg, type, callback) {
            if(type === 'success') {
                const successEl = $('<div>').css({
                    position: 'fixed',
                    top: '50%',
                    left: '50%',
                    transform: 'translate(-50%, -50%)',
                    background: 'linear-gradient(135deg, #4caf50 0%, #45a049 100%)',
                    color: 'white',
                    padding: '25px 35px',
                    borderRadius: '20px',
                    boxShadow: '0 10px 40px rgba(76, 175, 80, 0.4)',
                    zIndex: 10000,
                    fontSize: '18px',
                    fontWeight: 'bold',
                    textAlign: 'center',
                    minWidth: '200px',
                    animation: 'messageSlideIn 0.3s ease-out'
                }).html('<i class="fas fa-check-circle" style="font-size: 24px; margin-right: 10px;"></i>' + msg);
                $('body').append(successEl);
                setTimeout(function() {
                    successEl.fadeOut(300, function() {
                        $(this).remove();
                        if(callback) callback();
                    });
                }, 2000);
            } else {
                layer.msg(msg, {
                    icon: type === 'error' ? 2 : 0,
                    time: 2000,
                    skin: 'layui-layer-molv'
                }, callback || function(){});
            }
        }
    });
</script>
</body>
</html>
