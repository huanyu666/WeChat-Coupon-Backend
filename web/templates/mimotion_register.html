<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mimotion 注册</title>
    <link rel="stylesheet" href="/web/static/css/theme.css">
    <link rel="stylesheet" href="/web/static/css/mimotion.css">
    <script defer src="/web/static/js/mimotion_common.js"></script>
    <script defer src="/web/static/js/mimotion_auth.js"></script>
</head>
<body class="mimotion-page">
<main class="motion-shell motion-auth-shell">
    <section class="motion-hero">
        <span class="motion-kicker">USER REGISTRATION</span>
        <h1 class="motion-title">创建账号</h1>
        <div class="motion-rings" aria-hidden="true">
            <span class="motion-ring one"></span>
            <span class="motion-ring two"></span>
            <span class="motion-ring three"></span>
        </div>
    </section>

    <section class="motion-panel">
        <h1>注册</h1>
        <div class="motion-alert" data-auth-alert></div>
        <form class="motion-form" data-mimotion-auth-form data-mode="register">
            <label class="motion-label">用户名
                <input class="motion-input" name="username" autocomplete="username" required minlength="3">
            </label>
            <label class="motion-label">密码
                <input class="motion-input" name="password" type="password" autocomplete="new-password" required minlength="6">
            </label>
            <div class="motion-captcha-row">
                <label class="motion-label">验证码
                    <input class="motion-input" name="captcha" autocomplete="off" inputmode="text" required>
                </label>
                <img class="motion-captcha" id="captcha-img" alt="验证码">
            </div>
            <input type="hidden" name="captcha_id" id="captcha-id">
            <button class="motion-btn" type="submit">提交注册</button>
        </form>
        <a class="motion-link" href="/web/mimotion/login">返回登录</a>
    </section>
</main>
</body>
</html>
