<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>重复联系方式统计</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/web/static/css/admin_glass.css">
    <style>
        .warning-count {
            color: #b45309;
            font-weight: bold;
        }
        .danger-count {
            color: #b91c1c;
            font-weight: bold;
        }
    </style>
</head>
<body class="admin-glass-page">
    <div class="admin-shell">
        <div class="bg-shape shape-1"></div>
        <div class="bg-shape shape-2"></div>
        <div class="bg-shape shape-3"></div>
        <div class="admin-page">
        <section class="glass-card admin-hero">
            <span class="admin-kicker">行为统计</span>
            <h1 class="admin-title">重复联系方式统计</h1>
            <p class="admin-subtitle">按联系方式聚合高频重复提交，方便筛出刷量或异常登记来源。</p>
        </section>

        <!-- 导航 -->
        <ul class="nav nav-tabs admin-nav glass-card">
            <li class="nav-item">
                <a class="nav-link" href="/web/admin-zudui/">数据管理</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/web/admin-zudui/ipban">IP封禁管理</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/web/admin-zudui/ip-count">IP插入统计</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/web/admin-zudui/ip-delete-count">IP删除统计</a>
            </li>
            <li class="nav-item">
                <a class="nav-link active" href="/web/admin-zudui/contact-count">重复联系方式</a>
            </li>
        </ul>

        <!-- 筛选区域 -->
        <section class="card admin-card">
            <div class="card-body">
                <div class="admin-section-head">
                    <div>
                        <h2 class="admin-section-title">筛选条件</h2>
                        <div class="admin-section-note">按最少出现次数筛选，快速定位高风险联系方式。</div>
                    </div>
                </div>
                <form id="filterForm" class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label">最少出现次数</label>
                        <input type="number" class="form-control" name="min_count" id="minCountInput" value="20" min="1">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">每页条数</label>
                        <select class="form-select" name="page_size" id="pageSizeSelect">
                            <option value="20">20</option>
                            <option value="50">50</option>
                            <option value="100">100</option>
                        </select>
                    </div>
                    <div class="col-md-2 d-flex align-items-end">
                        <button type="submit" class="btn btn-primary w-100">查询</button>
                    </div>
                    <div class="col-md-2 d-flex align-items-end">
                        <button type="button" class="btn btn-danger w-100" onclick="deleteAllRecords()">一键删除所有</button>
                    </div>
                </form>
            </div>
        </section>

        <!-- 数据表格 -->
        <section class="card admin-card">
            <div class="card-body">
                <div class="admin-section-head">
                    <div>
                        <h2 class="admin-section-title">重复联系方式列表</h2>
                        <div class="admin-section-note">当前展示出现次数大于等于 <span id="currentMinCount">20</span> 的联系方式。</div>
                    </div>
                    <button class="btn btn-sm btn-primary" onclick="loadData(currentPage)">刷新</button>
                </div>
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th>联系方式</th>
                                <th>联系方式类型</th>
                                <th>出现次数</th>
                                <th>首次出现时间</th>
                                <th>最后出现时间</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="dataTable">
                            <tr>
                                <td colspan="6" class="text-center">加载中...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- 分页 -->
                <nav>
                    <ul class="pagination justify-content-center" id="pagination">
                    </ul>
                </nav>

                <div class="text-center mt-3">
                    <span id="paginationInfo"></span>
                </div>
            </div>
        </section>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let currentPage = 1;
        let totalPages = 1;
        let pageSize = 20;
        let minCount = 20;

        // 加载数据
        function loadData(page = 1) {
            currentPage = toPositiveInt(page, 1);
            pageSize = toPositiveInt(document.getElementById('pageSizeSelect').value, 20);
            minCount = toPositiveInt(document.getElementById('minCountInput').value, 20);
            
            const params = new URLSearchParams();
            params.append('page', currentPage);
            params.append('page_size', pageSize);
            params.append('min_count', minCount);

            document.getElementById('pageSizeSelect').value = String(pageSize);
            document.getElementById('minCountInput').value = String(minCount);
            document.getElementById('currentMinCount').textContent = minCount;

            fetch(`/web/api/admin/contact-count/list?${params.toString()}`)
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'success') {
                        renderTable(data.data);
                        totalPages = Math.ceil(data.total / pageSize);
                        renderPagination(data.total, data.page, pageSize);
                    } else {
                        alert('加载失败: ' + data.msg);
                    }
                })
                .catch(err => {
                    console.error('Error:', err);
                    alert('加载失败');
                });
        }

        // 渲染表格
        function renderTable(records) {
            const tbody = document.getElementById('dataTable');
            if (records.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center">暂无数据</td></tr>';
                return;
            }

            tbody.innerHTML = records.map(record => {
                const contactValue = String(record.contact || '').trim();
                const contactText = escapeHtml(contactValue);
                const contactAttr = escapeAttr(contactValue);
                const contactType = escapeHtml(record.contact_type || '未知');
                const count = toSafeInt(record.count, 0);
                const firstInsertAgo = escapeHtml(record.first_insert_ago || '');
                const lastInsertAgo = escapeHtml(record.last_insert_ago || '');
                let countClass = '';
                if (count >= 50) {
                    countClass = 'danger-count';
                } else if (count >= 30) {
                    countClass = 'warning-count';
                }
                
                return `
                <tr>
                    <td>${contactText}</td>
                    <td>${contactType}</td>
                    <td class="${countClass}">${count}</td>
                    <td>${formatDateTime(record.first_insert_at)}<br><small class="text-muted">${firstInsertAgo}</small></td>
                    <td>${formatDateTime(record.last_insert_at)}<br><small class="text-muted">${lastInsertAgo}</small></td>
                    <td>
                        <button class="btn btn-sm btn-warning" onclick="deleteContactData(this.dataset.contact)" data-contact="${contactAttr}">删除该联系方式数据</button>
                    </td>
                </tr>
            `;
            }).join('');
        }

        // 渲染分页
        function renderPagination(total, page, pageSize) {
            const pagination = document.getElementById('pagination');
            const info = document.getElementById('paginationInfo');
            
            info.textContent = `共 ${total} 条记录，第 ${page} / ${totalPages} 页`;

            let html = '';
            // 上一页
            html += `<li class="page-item ${page <= 1 ? 'disabled' : ''}">
                <a class="page-link" href="#" onclick="loadData(${page - 1}); return false;">上一页</a>
            </li>`;

            // 页码
            const startPage = Math.max(1, page - 2);
            const endPage = Math.min(totalPages, page + 2);
            
            if (startPage > 1) {
                html += `<li class="page-item"><a class="page-link" href="#" onclick="loadData(1); return false;">1</a></li>`;
                if (startPage > 2) {
                    html += `<li class="page-item disabled"><span class="page-link">...</span></li>`;
                }
            }

            for (let i = startPage; i <= endPage; i++) {
                html += `<li class="page-item ${i === page ? 'active' : ''}">
                    <a class="page-link" href="#" onclick="loadData(${i}); return false;">${i}</a>
                </li>`;
            }

            if (endPage < totalPages) {
                if (endPage < totalPages - 1) {
                    html += `<li class="page-item disabled"><span class="page-link">...</span></li>`;
                }
                html += `<li class="page-item"><a class="page-link" href="#" onclick="loadData(${totalPages}); return false;">${totalPages}</a></li>`;
            }

            // 下一页
            html += `<li class="page-item ${page >= totalPages ? 'disabled' : ''}">
                <a class="page-link" href="#" onclick="loadData(${page + 1}); return false;">下一页</a>
            </li>`;

            pagination.innerHTML = html;
        }

        // 删除联系方式数据
        function deleteContactData(contact) {
            const safeContact = String(contact || '').trim();
            if (!safeContact) {
                alert('无效联系方式');
                return;
            }
            if (!confirm(`确定要删除联系方式 "${safeContact}" 的所有数据吗？此操作不可恢复！`)) return;
            
            // 构建查询条件删除
            const params = new URLSearchParams();
            params.append('contact', safeContact);

            fetch(`/web/api/admin/zudui/delete-by-filter?${params.toString()}`, {
                method: 'POST'
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    alert(data.msg);
                    loadData(currentPage);
                } else {
                    alert('删除失败: ' + data.msg);
                }
            })
            .catch(err => {
                console.error('Error:', err);
                alert('删除失败');
            });
        }

        // 工具函数
        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, function(char) {
                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#39;'
                }[char];
            });
        }

        function escapeAttr(value) {
            return escapeHtml(value).replace(/`/g, '&#96;');
        }

        function toSafeInt(value, fallback = 0) {
            const number = Number.parseInt(value, 10);
            return Number.isFinite(number) ? number : fallback;
        }

        function toPositiveInt(value, fallback = 1) {
            const number = toSafeInt(value, fallback);
            return number > 0 ? number : fallback;
        }

        function formatDateTime(dateStr) {
            if (!dateStr) return '';
            const date = new Date(dateStr);
            return date.toLocaleString('zh-CN');
        }

        // 删除所有查询到的记录
        function deleteAllRecords() {
            const safeMinCount = toPositiveInt(document.getElementById('minCountInput').value, 20);
            document.getElementById('minCountInput').value = String(safeMinCount);
            if (!confirm(`确定要删除所有出现次数≥${safeMinCount}的联系方式记录吗？此操作不可恢复！`)) return;
            
            fetch('/web/api/admin/contact-count/delete', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ min_count: safeMinCount })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    alert(data.msg);
                    loadData(1);
                } else {
                    alert('删除失败: ' + data.msg);
                }
            })
            .catch(err => {
                console.error('Error:', err);
                alert('删除失败');
            });
        }

        // 表单提交
        document.getElementById('filterForm').addEventListener('submit', function(e) {
            e.preventDefault();
            loadData(1);
        });

        // 初始化加载
        loadData(1);
    </script>
</body>
</html>
