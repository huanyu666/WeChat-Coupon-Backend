<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>后台管理 | 美团查询系统</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/web/static/css/theme.css">
    <style>
        .floating-element {
            position: fixed;
            z-index: 0;
            pointer-events: none;
        }
        .app-container {
            position: relative;
            z-index: 1;
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px dashed rgba(255, 133, 162, 0.55);
            padding-bottom: 10px;
        }
        .tab {
            padding: 12px 24px;
            cursor: pointer;
            background: transparent;
            border: none;
            border-bottom: 3px solid transparent;
            color: #ff4081;
            font-size: 16px;
            font-weight: 800;
            font-family: inherit;
            transition: all 0.3s;
            border-radius: 12px 12px 0 0;
        }
        .tab.active {
            border-bottom-color: #ff4081;
            background: rgba(255, 64, 129, 0.1);
        }
        .tab:hover {
            background: rgba(255, 64, 129, 0.05);
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .search-box {
            margin-bottom: 20px;
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            background: rgba(255, 229, 236, 0.5);
            padding: 16px;
            border-radius: 16px;
            border: 2px solid rgba(255, 175, 204, 0.4);
        }
        .search-box input[type="text"] {
            flex: 1;
            min-width: 300px;
            padding: 14px 18px;
            border: 2px solid #ffd6e7;
            border-radius: 15px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.9);
            transition: all 0.25s ease;
            outline: none;
            font-family: inherit;
        }
        .search-box input[type="text"]:focus {
            border-color: #ff85a2;
            box-shadow: 0 0 0 4px rgba(255, 133, 162, 0.22);
            background: white;
        }
        .search-box select {
            padding: 14px 18px;
            border: 2px solid #ffd6e7;
            border-radius: 15px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.9);
            color: #ff4081;
            font-weight: 700;
            cursor: pointer;
            outline: none;
            font-family: inherit;
            min-width: 150px;
        }
        .search-box select:focus {
            border-color: #ff85a2;
            box-shadow: 0 0 0 4px rgba(255, 133, 162, 0.22);
            background: white;
        }
        .batch-actions {
            margin: 20px 0;
            padding: 16px;
            background: rgba(255, 133, 162, 0.1);
            border-radius: 16px;
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            border: 2px solid rgba(255, 175, 204, 0.4);
        }
        .batch-actions input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #ff4081;
        }
        .batch-actions label {
            color: #ff4081;
            font-weight: 700;
            cursor: pointer;
        }
        .table-wrap {
            margin-top: 20px;
            overflow: visible;
            display: inline-block;
            min-width: 100%;
        }
        .status-badge {
            padding: 6px 14px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 800;
            display: inline-block;
        }
        .status-pending {
            background: linear-gradient(45deg, #ff9800, #ffb74d);
            color: white;
        }
        .status-approved {
            background: linear-gradient(45deg, #4caf50, #66bb6a);
            color: white;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal-content {
            background: linear-gradient(135deg, #fff 0%, #ffeef5 100%);
            border: 3px solid rgba(255, 133, 162, 0.8);
            border-radius: 20px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 10px 40px rgba(255, 64, 129, 0.3);
        }
        .modal-header {
            font-size: 24px;
            color: #ff4081;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 800;
        }
        .modal-body {
            margin-bottom: 20px;
        }
        .modal-footer {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
            padding: 15px;
            background: rgba(255, 229, 236, 0.3);
            border-radius: 16px;
        }
        .pagination button {
            padding: 10px 18px;
            border: 2px solid #ffd6e7;
            background: white;
            color: #ff4081;
            border-radius: 12px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 700;
            transition: all 0.25s ease;
        }
        .pagination button:hover:not(:disabled) {
            background: #ffe5ec;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 64, 129, 0.2);
        }
        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .pagination .page-info {
            padding: 10px 18px;
            color: #ff4081;
            font-weight: 800;
        }
        input[type="number"] {
            width: 100px;
            padding: 10px 12px;
            border: 2px solid #ffd6e7;
            border-radius: 12px;
            outline: none;
            font-family: inherit;
            font-size: 15px;
        }
        input[type="number"]:focus {
            border-color: #ff85a2;
            box-shadow: 0 0 0 4px rgba(255, 133, 162, 0.22);
        }
        .btn-sm {
            padding: 8px 14px;
            font-size: 14px;
            height: auto;
        }
        .table-container {
            overflow-x: auto;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
            touch-action: pan-x;
            margin: 20px 0;
            width: 100%;
            max-width: 100%;
            scrollbar-width: thin;
            position: relative;
            border-radius: 18px;
            border: 2px solid rgba(255, 175, 204, 0.55);
            background: rgba(255, 255, 255, 0.75);
            box-shadow: 0 10px 25px rgba(255, 105, 180, 0.18);
        }
        .table-container table {
            width: max-content;
            min-width: 800px;
            border-collapse: separate;
            border-spacing: 0;
        }
        .table-container table thead tr:first-child th:first-child {
            border-top-left-radius: 16px;
        }
        .table-container table thead tr:first-child th:last-child {
            border-top-right-radius: 16px;
        }
        .table-container table tbody tr:last-child td:first-child {
            border-bottom-left-radius: 16px;
        }
        .table-container table tbody tr:last-child td:last-child {
            border-bottom-right-radius: 16px;
        }
        .table-container::-webkit-scrollbar {
            height: 8px;
        }
        .table-container::-webkit-scrollbar-track {
            background: rgba(255, 133, 162, 0.1);
            border-radius: 4px;
        }
        .table-container::-webkit-scrollbar-thumb {
            background: rgba(255, 133, 162, 0.4);
            border-radius: 4px;
        }
        .table-container::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 133, 162, 0.6);
        }
        @media (max-width: 768px) {
            body {
                font-size: 16px;
            }
            .tabs {
                flex-wrap: wrap;
                gap: 8px;
            }
            .tab {
                padding: 12px 18px;
                font-size: 16px;
                flex: 1;
                min-width: 120px;
            }
            .search-box {
                flex-direction: column;
                align-items: stretch;
            }
            .search-box input[type="text"] {
                min-width: auto;
                width: 100%;
                font-size: 16px;
                padding: 16px 18px;
            }
            .search-box select {
                width: 100%;
                min-width: auto;
                font-size: 16px;
                padding: 16px 18px;
            }
            .batch-actions {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
            }
            .batch-actions input[type="checkbox"] {
                width: 24px;
                height: 24px;
                flex-shrink: 0;
                margin-right: 8px;
            }
            .batch-actions label {
                font-size: 16px;
            }
            .batch-actions .btn {
                width: 100%;
                padding: 12px 16px;
                font-size: 15px;
                min-height: 44px;
                text-align: center;
                box-sizing: border-box;
            }
            .table-container {
                margin: 15px -15px;
                padding: 0 15px;
                width: calc(100% + 30px);
                max-width: 100vw;
                overflow-x: auto;
                overflow-y: hidden;
                -webkit-overflow-scrolling: touch;
                touch-action: pan-x;
                position: relative;
            }
            .table-container table {
                font-size: 15px;
            }
            .table-container th,
            .table-container td {
                padding: 12px 8px;
                font-size: 15px;
            }
            .table-container th {
                font-size: 15px;
                font-weight: 700;
            }
            .table-container th input[type="checkbox"] {
                width: 24px;
                height: 24px;
            }
            .table-container td input[type="checkbox"] {
                width: 24px;
                height: 24px;
            }
            .pagination {
                flex-wrap: wrap;
                gap: 8px;
            }
            .pagination button {
                padding: 12px 16px;
                font-size: 15px;
                min-height: 44px;
            }
            .pagination .page-info {
                padding: 12px 16px;
                font-size: 15px;
                width: 100%;
                text-align: center;
            }
            .stats {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }
            .stat-card {
                padding: 18px;
            }
            .stat-card h3 {
                font-size: 14px;
            }
            .stat-card .value {
                font-size: 24px;
            }
            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }
            .header h1 {
                font-size: 22px;
            }
            .header .nav {
                flex-wrap: wrap;
                gap: 10px;
            }
            .header .nav a {
                font-size: 14px;
                padding: 8px 12px;
            }
            input[type="number"] {
                width: 100px;
                padding: 12px 14px;
                font-size: 16px;
            }
            .btn-sm {
                padding: 10px 14px;
                font-size: 15px;
                min-height: 44px;
            }
            .modal-content {
                width: 95%;
                padding: 24px;
                margin: 10px;
            }
            .modal-header {
                font-size: 22px;
            }
            .status-badge {
                padding: 8px 14px;
                font-size: 14px;
            }
        }
        @media (max-width: 480px) {
            body {
                font-size: 16px;
            }
            .stats {
                grid-template-columns: 1fr;
            }
            .tab {
                padding: 12px 16px;
                font-size: 15px;
            }
            .table-container {
                margin: 15px -10px;
                padding: 0 10px;
                width: calc(100% + 20px);
                max-width: 100vw;
                overflow-x: auto;
                overflow-y: hidden;
                -webkit-overflow-scrolling: touch;
                touch-action: pan-x;
                position: relative;
            }
            .table-container table {
                font-size: 14px;
                min-width: 700px;
            }
            .table-container th,
            .table-container td {
                padding: 10px 6px;
                font-size: 14px;
            }
            .table-container th {
                font-size: 14px;
            }
            .table-container th input[type="checkbox"] {
                width: 28px;
                height: 28px;
            }
            .table-container td input[type="checkbox"] {
                width: 28px;
                height: 28px;
            }
            .status-badge {
                padding: 6px 12px;
                font-size: 13px;
            }
            .batch-actions .btn {
                font-size: 14px;
                padding: 10px 14px;
                min-height: 42px;
                white-space: nowrap;
                flex: 1 1 0;
                min-width: 0;
                text-align: center;
            }
            .btn-sm {
                padding: 10px 12px;
                font-size: 14px;
                min-height: 42px;
            }
        }
        .tabs {
            gap: 8px;
            margin-bottom: 18px;
            padding-bottom: 0;
            border-bottom: none;
        }

        .tab {
            padding: 10px 16px;
            border-radius: 12px;
            border: 1px solid transparent;
            color: #64748b;
            font-size: 14px;
            font-weight: 600;
        }

        .tab.active {
            color: #fff;
            border-bottom-color: transparent;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            box-shadow: 0 12px 24px rgba(37, 99, 235, 0.22);
        }

        .search-box,
        .batch-actions {
            background: rgba(255, 255, 255, 0.34);
            border: 1px solid rgba(255, 255, 255, 0.48);
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
        }

        .search-box input[type="text"],
        .search-box select,
        input[type="number"] {
            border: 1px solid rgba(148, 163, 184, 0.24);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.74);
            color: #1e293b;
        }

        .search-box input[type="text"]:focus,
        .search-box select:focus,
        input[type="number"]:focus {
            border-color: rgba(37, 99, 235, 0.42);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
            background: rgba(255, 255, 255, 0.9);
        }

        .status-pending {
            background: linear-gradient(135deg, #d97706, #b45309);
        }

        .status-approved {
            background: linear-gradient(135deg, #0f766e, #115e59);
        }

        .pagination {
            background: rgba(255, 255, 255, 0.28);
        }

        .pagination button {
            border: 1px solid rgba(148, 163, 184, 0.24);
            background: rgba(255, 255, 255, 0.74);
            color: #1e293b;
        }

        .pagination .page-info {
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="floating-element heart" style="top: 10%; left: 5%;"><i class="fas fa-heart"></i></div>
    <div class="floating-element star" style="top: 15%; right: 8%; animation-delay: 1s;"><i class="fas fa-star"></i></div>
    <div class="floating-element sparkle" style="bottom: 20%; left: 10%; animation-delay: 2s;"><i class="fas fa-sparkles"></i></div>
    <div class="floating-element heart" style="bottom: 15%; right: 12%; animation-delay: 3s;"><i class="fas fa-heart"></i></div>
    <div class="floating-element star" style="top: 40%; right: 5%; animation-delay: 4s;"><i class="fas fa-star"></i></div>
    <div class="floating-element sparkle" style="top: 60%; left: 8%; animation-delay: 5s;"><i class="fas fa-sparkles"></i></div>

    <div id="passwordModal" class="modal-overlay" onclick="if(event.target === this) closePasswordModal();">
        <div class="modal-content" onclick="event.stopPropagation();">
            <div class="modal-header" id="passwordModalTitle">修改密码</div>
            <div class="modal-body" id="passwordModalBody"></div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closePasswordModal()">取消</button>
                <button class="btn btn-primary" id="passwordModalConfirmBtn" onclick="confirmPasswordChange()">确定</button>
            </div>
        </div>
    </div>

    <div class="app-container wide allow-inner-scroll admin-shell">
        <div class="header border-bottom">
            <h1><i class="fas fa-user-shield"></i> 后台管理系统</h1>
            <div class="nav">
                <a href="/web/query">返回查询</a>
                <a href="#" onclick="showChangeMyPassword()">修改我的密码</a>
                <a href="#" onclick="logout()">退出登录</a>
            </div>
        </div>

        <div class="stats" id="stats">
            <div class="stat-card">
                <h3>总用户数</h3>
                <div class="value" id="totalUsers">0</div>
            </div>
            <div class="stat-card">
                <h3>总查询次数</h3>
                <div class="value" id="totalQueries">0</div>
            </div>
            <div class="stat-card">
                <h3>活跃用户</h3>
                <div class="value" id="activeUsers">0</div>
            </div>
            <div class="stat-card">
                <h3>总剩余次数</h3>
                <div class="value" id="totalQueryCount">0</div>
            </div>
        </div>

        <div class="section">
            <div class="tabs">
                <button class="tab active" onclick="switchTab('review')"><i class="fas fa-clipboard-list"></i> 用户审核</button>
                <button class="tab" onclick="switchTab('users')"><i class="fas fa-users"></i> 用户管理</button>
            </div>

            <div id="reviewTab" class="tab-content active">
                <div class="search-box">
                    <input type="text" id="pendingSearch" placeholder="搜索用户名..." onkeyup="if(event.key==='Enter') loadPendingUsers()">
                    <button class="btn btn-primary" onclick="loadPendingUsers()">
                        <i class="fas fa-search"></i> 搜索
                    </button>
                </div>
                <div class="batch-actions">
                    <input type="checkbox" id="selectAllPending" onchange="toggleSelectAllPending()">
                    <label for="selectAllPending">全选</label>
                    <button class="btn btn-success" onclick="batchApprove()">
                        <i class="fas fa-check"></i> 批量审核通过
                    </button>
                    <button class="btn btn-danger" onclick="batchReject()">
                        <i class="fas fa-times"></i> 批量拒绝
                    </button>
                </div>
                <div class="table-container">
                    <div class="table-wrap">
                        <table>
                            <thead>
                                <tr>
                                    <th><input type="checkbox" id="selectAllPendingHeader" onchange="toggleSelectAllPending()"></th>
                                    <th>ID</th>
                                    <th>用户名</th>
                                    <th>状态</th>
                                    <th>注册时间</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id="pendingTableBody"></tbody>
                        </table>
                    </div>
                </div>
                <div class="pagination" id="pendingPagination"></div>
            </div>

            <div id="usersTab" class="tab-content">
                <div class="search-box">
                    <input type="text" id="userSearch" placeholder="搜索用户名..." onkeyup="if(event.key==='Enter') loadUsers()">
                    <select id="statusFilter" onchange="loadUsers()">
                        <option value="">全部状态</option>
                        <option value="pending">待审核</option>
                        <option value="approved">已审核</option>
                    </select>
                    <button class="btn btn-primary" onclick="loadUsers()">
                        <i class="fas fa-search"></i> 搜索
                    </button>
                </div>
                <div class="table-container">
                    <div class="table-wrap">
                        <table>
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>用户名</th>
                                    <th>状态</th>
                                    <th>管理员</th>
                                    <th>剩余次数</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id="userTableBody"></tbody>
                        </table>
                    </div>
                </div>
                <div class="pagination" id="usersPagination"></div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script>
        function hashPassword(password) {
            return CryptoJS.SHA256(password).toString();
        }

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, function(char) {
                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#39;'
                }[char];
            });
        }

        function escapeAttr(value) {
            return escapeHtml(value).replace(/`/g, '&#96;');
        }

        function toSafeInt(value, fallback = 0) {
            const number = Number.parseInt(value, 10);
            return Number.isFinite(number) ? number : fallback;
        }

        function toPositiveInt(value, fallback = 1) {
            const number = toSafeInt(value, fallback);
            return number > 0 ? number : fallback;
        }

        let passwordModalCallback = null;
        let passwordModalData = {};
        
        let pendingPage = 1;
        let pendingPageSize = 20;
        let pendingTotal = 0;
        let usersPage = 1;
        let usersPageSize = 20;
        let usersTotal = 0;
        let currentUserIsSuperAdmin = false;
        
        function switchTab(tabName) {
            $('.tab').removeClass('active');
            $('.tab-content').removeClass('active');
            if(tabName === 'review') {
                $('.tab').first().addClass('active');
                $('#reviewTab').addClass('active');
            } else {
                $('.tab').last().addClass('active');
                $('#usersTab').addClass('active');
            }
        }

        function loadStats() {
            $.get('/web/admin/api/stats', function(stats) {
                $('#totalUsers').text(stats.total_users || 0);
                $('#totalQueries').text(stats.total_queries || 0);
                $('#activeUsers').text(stats.active_users || 0);
                $('#totalQueryCount').text(stats.total_query_count || 0);
            });
        }
        
        function loadCurrentUserInfo(callback) {
            $.get('/web/api/user', function(user) {
                if(user && user.is_super_admin) {
                    currentUserIsSuperAdmin = true;
                } else {
                    currentUserIsSuperAdmin = false;
                }
                if(callback) callback();
            }).fail(function() {
                currentUserIsSuperAdmin = false;
                if(callback) callback();
            });
        }

        function loadPendingUsers(page = 1) {
            const safePage = toPositiveInt(page, 1);
            pendingPage = safePage;
            const search = $('#pendingSearch').val();
            $.get('/web/admin/api/users', {
                status: 'pending', 
                search: search,
                page: safePage,
                page_size: pendingPageSize
            }, function(data) {
                const users = data.users || [];
                pendingTotal = toSafeInt(data.total, 0);
                let html = '';
                if(users.length === 0) {
                    html = '<tr><td colspan="6" style="text-align:center;padding:40px;color:#999;">暂无待审核用户</td></tr>';
                } else {
                    users.forEach(user => {
                        const userId = toSafeInt(user.id);
                        const username = escapeHtml(user.username);
                        const statusText = user.status === 'pending' ? '待审核' : 
                                          user.status === 'approved' ? '已审核' : '已拒绝';
                        const statusClass = user.status === 'pending' ? 'status-pending' : 
                                          user.status === 'approved' ? 'status-approved' : 'status-rejected';
                        const createdAt = user.created_at ? escapeHtml(new Date(user.created_at).toLocaleString('zh-CN')) : '-';
                        html += `<tr>
                            <td><input type="checkbox" class="pending-checkbox" value="${userId}"></td>
                            <td>${userId}</td>
                            <td>${username}</td>
                            <td><span class="status-badge ${statusClass}">${statusText}</span></td>
                            <td>${createdAt}</td>
                            <td>
                                <button class="btn btn-success btn-sm" onclick="approveUser(${userId})">审核通过</button>
                                <button class="btn btn-danger btn-sm" onclick="rejectUser(${userId})">拒绝</button>
                            </td>
                        </tr>`;
                    });
                }
                $('#pendingTableBody').html(html);
                renderPendingPagination();
            });
        }
        
        function renderPendingPagination() {
            const totalPages = Math.max(1, Math.ceil(pendingTotal / pendingPageSize));
            let html = '';
            if(totalPages > 1) {
                html += `<button onclick="loadPendingUsers(1)" ${pendingPage === 1 ? 'disabled' : ''}>首页</button>`;
                html += `<button onclick="loadPendingUsers(${pendingPage - 1})" ${pendingPage === 1 ? 'disabled' : ''}>上一页</button>`;
                html += `<span class="page-info">第 ${pendingPage} 页 / 共 ${totalPages} 页 (共 ${pendingTotal} 条)</span>`;
                html += `<button onclick="loadPendingUsers(${pendingPage + 1})" ${pendingPage >= totalPages ? 'disabled' : ''}>下一页</button>`;
                html += `<button onclick="loadPendingUsers(${totalPages})" ${pendingPage >= totalPages ? 'disabled' : ''}>末页</button>`;
            } else {
                html += `<span class="page-info">共 ${pendingTotal} 条</span>`;
            }
            $('#pendingPagination').html(html);
        }

        function loadUsers(page = 1) {
            const safePage = toPositiveInt(page, 1);
            usersPage = safePage;
            const search = $('#userSearch').val();
            const status = $('#statusFilter').val();
            
            const fetchAndRender = function() {
                $.get('/web/admin/api/users', {
                    search: search, 
                    status: status,
                    page: safePage,
                    page_size: usersPageSize
                }, function(data) {
                    const users = data.users || [];
                    usersTotal = toSafeInt(data.total, 0);
                    renderUsersTable(users);
                });
            };
            
            if(!currentUserIsSuperAdmin) {
                loadCurrentUserInfo(fetchAndRender);
            } else {
                fetchAndRender();
            }
        }
        
        function renderUsersTable(users) {
            let html = '';
            if(users.length === 0) {
                html = '<tr><td colspan="6" style="text-align:center;padding:40px;color:#999;">暂无用户</td></tr>';
            } else {
                users.forEach(user => {
                    const userId = toSafeInt(user.id);
                    const username = escapeHtml(user.username);
                    const usernameAttr = escapeAttr(user.username);
                    const queryCount = toSafeInt(user.query_count);
                    const statusText = user.status === 'pending' ? '待审核' : 
                                      user.status === 'approved' ? '已审核' : '已拒绝';
                    const statusClass = user.status === 'pending' ? 'status-pending' : 
                                      user.status === 'approved' ? 'status-approved' : 'status-rejected';
                    const adminBadge = user.is_super_admin ? '超级管理员' : (user.is_admin ? '管理员' : '普通用户');
                    const toggleButton = currentUserIsSuperAdmin && !user.is_super_admin ? `<br><button class="btn ${user.is_admin ? 'btn-danger' : 'btn-success'} btn-sm" onclick="toggleAdmin(${userId}, ${!user.is_admin})" style="margin-top:5px;">${user.is_admin ? '降级为普通用户' : '提升为管理员'}</button>` : '';
                    html += `<tr>
                        <td>${userId}</td>
                        <td>
                            <span id="username_${userId}">${username}</span>
                            <button class="btn btn-warning btn-sm" onclick="showChangeUsername(${userId}, this.dataset.username)" data-username="${usernameAttr}" title="修改用户名">
                                <i class="fas fa-edit"></i>
                            </button>
                        </td>
                        <td><span class="status-badge ${statusClass}">${statusText}</span></td>
                        <td>${adminBadge}${toggleButton}</td>
                        <td>
                            <input type="number" id="count_${userId}" value="${queryCount}" min="0">
                            <button class="btn btn-primary btn-sm" onclick="updateUser(${userId})">更新</button>
                        </td>
                        <td>
                            <button class="btn btn-secondary btn-sm" onclick="showChangeUserPassword(${userId}, this.dataset.username)" data-username="${usernameAttr}">修改密码</button>
                            ${!user.is_admin ? `<button class="btn btn-danger btn-sm" onclick="deleteUser(${userId})">删除</button>` : ''}
                        </td>
                    </tr>`;
                });
            }
            $('#userTableBody').html(html);
            renderUsersPagination();
        }
        
        function renderUsersPagination() {
            const totalPages = Math.max(1, Math.ceil(usersTotal / usersPageSize));
            let html = '';
            if(totalPages > 1) {
                html += `<button onclick="loadUsers(1)" ${usersPage === 1 ? 'disabled' : ''}>首页</button>`;
                html += `<button onclick="loadUsers(${usersPage - 1})" ${usersPage === 1 ? 'disabled' : ''}>上一页</button>`;
                html += `<span class="page-info">第 ${usersPage} 页 / 共 ${totalPages} 页 (共 ${usersTotal} 条)</span>`;
                html += `<button onclick="loadUsers(${usersPage + 1})" ${usersPage >= totalPages ? 'disabled' : ''}>下一页</button>`;
                html += `<button onclick="loadUsers(${totalPages})" ${usersPage >= totalPages ? 'disabled' : ''}>末页</button>`;
            } else {
                html += `<span class="page-info">共 ${usersTotal} 条</span>`;
            }
            $('#usersPagination').html(html);
        }
        
        function showChangeUsername(userId, currentUsername) {
            const safeCurrentUsername = String(currentUsername || '');
            const body = `
                <div class="form-group">
                    <label class="form-label">当前用户名: ${escapeHtml(safeCurrentUsername)}</label>
                </div>
                <div class="form-group">
                    <label class="form-label">新用户名</label>
                    <input type="text" id="newUsername" class="form-control" value="${escapeAttr(safeCurrentUsername)}" required>
                </div>
            `;
            showPasswordModal('修改用户名', body, function() {
                const newUsername = $('#newUsername').val().trim();
                if(!newUsername) {
                    alert('用户名不能为空');
                    return;
                }
                if(newUsername === currentUsername) {
                    alert('新用户名与当前用户名相同');
                    return;
                }
                
                $.ajax({
                    url: `/web/admin/api/users/${userId}`,
                    method: 'PUT',
                    contentType: 'application/json',
                    data: JSON.stringify({
                        username: newUsername
                    }),
                    success: function() {
                        alert('用户名修改成功');
                        closePasswordModal();
                        loadUsers(usersPage);
                    },
                    error: function(xhr) {
                        alert('修改失败: ' + (xhr.responseJSON?.error || '未知错误'));
                    }
                });
            });
        }

        function toggleSelectAllPending() {
            const checked = $('#selectAllPending').prop('checked') || $('#selectAllPendingHeader').prop('checked');
            $('.pending-checkbox').prop('checked', checked);
            $('#selectAllPending').prop('checked', checked);
            $('#selectAllPendingHeader').prop('checked', checked);
        }

        function getSelectedPendingUsers() {
            const selected = [];
            $('.pending-checkbox:checked').each(function() {
                const userId = toSafeInt($(this).val(), -1);
                if(userId > 0) {
                    selected.push(userId);
                }
            });
            return selected;
        }

        function approveUser(id) {
            if(confirm('确定要审核通过该用户吗？')) {
                batchApproveUsers([id]);
            }
        }

        function rejectUser(id) {
            if(confirm('确定要拒绝该用户吗？拒绝后该用户将被删除。')) {
                batchRejectUsers([id]);
            }
        }

        function batchApprove() {
            const selected = getSelectedPendingUsers();
            if(selected.length === 0) {
                alert('请至少选择一个用户');
                return;
            }
            if(confirm(`确定要审核通过 ${selected.length} 个用户吗？`)) {
                batchApproveUsers(selected);
            }
        }

        function batchReject() {
            const selected = getSelectedPendingUsers();
            if(selected.length === 0) {
                alert('请至少选择一个用户');
                return;
            }
            if(confirm(`确定要拒绝 ${selected.length} 个用户吗？拒绝后这些用户将被删除。`)) {
                batchRejectUsers(selected);
            }
        }

        function batchApproveUsers(userIds) {
            const safeUserIds = (Array.isArray(userIds) ? userIds : []).map(id => toSafeInt(id, -1)).filter(id => id > 0);
            if(safeUserIds.length === 0) {
                alert('未选择有效用户');
                return;
            }
            $.ajax({
                url: '/web/admin/api/users/batch-approve',
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({user_ids: safeUserIds}),
                success: function(response) {
                    alert('批量审核成功');
                    pendingPage = 1;
                    loadPendingUsers(1);
                    loadUsers(usersPage);
                    loadStats();
                },
                error: function(xhr) {
                    alert('批量审核失败: ' + (xhr.responseJSON?.error || '未知错误'));
                }
            });
        }

        function batchRejectUsers(userIds) {
            const safeUserIds = (Array.isArray(userIds) ? userIds : []).map(id => toSafeInt(id, -1)).filter(id => id > 0);
            if(safeUserIds.length === 0) {
                alert('未选择有效用户');
                return;
            }
            $.ajax({
                url: '/web/admin/api/users/batch-reject',
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({user_ids: safeUserIds}),
                success: function(response) {
                    alert('批量拒绝成功');
                    pendingPage = 1;
                    loadPendingUsers(1);
                    loadUsers(usersPage);
                    loadStats();
                },
                error: function(xhr) {
                    alert('批量拒绝失败: ' + (xhr.responseJSON?.error || '未知错误'));
                }
            });
        }

        function updateUser(id) {
            const userId = toSafeInt(id, -1);
            if(userId <= 0) {
                alert('无效用户ID');
                return;
            }

            const rawCount = $('#count_' + userId).val();
            const count = toSafeInt(rawCount, -1);
            if(count < 0) {
                alert('剩余次数必须是大于等于 0 的整数');
                return;
            }

            $.ajax({
                url: `/web/admin/api/users/${userId}`,
                method: 'PUT',
                contentType: 'application/json',
                data: JSON.stringify({query_count: count}),
                success: function() {
                    alert('更新成功');
                    loadUsers(usersPage);
                    loadStats();
                },
                error: function(xhr) {
                    alert('更新失败: ' + (xhr.responseJSON?.error || '未知错误'));
                }
            });
        }
        
        function toggleAdmin(userId, makeAdmin) {
            const safeUserId = toSafeInt(userId, -1);
            if(safeUserId <= 0) {
                alert('无效用户ID');
                return;
            }

            const action = makeAdmin ? '提升为管理员' : '降级为普通用户';
            if(!confirm(`确定要${action}吗？`)) {
                return;
            }
            
            $.ajax({
                url: `/web/admin/api/users/${safeUserId}`,
                method: 'PUT',
                contentType: 'application/json',
                data: JSON.stringify({is_admin: makeAdmin}),
                success: function() {
                    alert(`${action}成功`);
                    loadUsers(usersPage);
                    loadStats();
                },
                error: function(xhr) {
                    alert(`${action}失败: ` + (xhr.responseJSON?.error || '未知错误'));
                }
            });
        }

        function deleteUser(id) {
            const userId = toSafeInt(id, -1);
            if(userId <= 0) {
                alert('无效用户ID');
                return;
            }

            if(confirm('确定删除该用户?')) {
                $.ajax({
                    url: `/web/admin/api/users/${userId}`,
                    method: 'DELETE',
                    success: function() {
                        alert('删除成功');
                        loadUsers(usersPage);
                        loadStats();
                    },
                    error: function(xhr) {
                        alert('删除失败: ' + (xhr.responseJSON?.error || '未知错误'));
                    }
                });
            }
        }

        function showChangeMyPassword() {
            const body = `
                <div class="form-group">
                    <label class="form-label">旧密码</label>
                    <input type="password" id="oldPassword" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="form-label">新密码</label>
                    <input type="password" id="newPassword" class="form-control" required minlength="6">
                </div>
                <div class="form-group">
                    <label class="form-label">确认新密码</label>
                    <input type="password" id="confirmPassword" class="form-control" required minlength="6">
                </div>
            `;
            showPasswordModal('修改我的密码', body, function() {
                const oldPassword = $('#oldPassword').val();
                const newPassword = $('#newPassword').val();
                const confirmPassword = $('#confirmPassword').val();
                
                if(!oldPassword || !newPassword || !confirmPassword) {
                    alert('请填写完整信息');
                    return;
                }
                if(newPassword !== confirmPassword) {
                    alert('两次输入的密码不一致');
                    return;
                }
                if(newPassword.length < 6) {
                    alert('密码长度至少6位');
                    return;
                }
                
                $.ajax({
                    url: '/web/api/change-password',
                    method: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({
                        old_password: hashPassword(oldPassword),
                        new_password: hashPassword(newPassword)
                    }),
                    success: function() {
                        alert('密码修改成功，请重新登录');
                        logout();
                    },
                    error: function(xhr) {
                        alert('修改失败: ' + (xhr.responseJSON?.error || '未知错误'));
                    }
                });
            });
        }

        function showChangeUserPassword(userId, username) {
            const safeUsername = String(username || '');
            const body = `
                <div class="form-group">
                    <label class="form-label">用户: ${escapeHtml(safeUsername)}</label>
                </div>
                <div class="form-group">
                    <label class="form-label">新密码</label>
                    <input type="password" id="adminNewPassword" class="form-control" required minlength="6">
                </div>
                <div class="form-group">
                    <label class="form-label">确认新密码</label>
                    <input type="password" id="adminConfirmPassword" class="form-control" required minlength="6">
                </div>
            `;
            showPasswordModal('修改用户密码', body, function() {
                const newPassword = $('#adminNewPassword').val();
                const confirmPassword = $('#adminConfirmPassword').val();
                
                if(!newPassword || !confirmPassword) {
                    alert('请填写完整信息');
                    return;
                }
                if(newPassword !== confirmPassword) {
                    alert('两次输入的密码不一致');
                    return;
                }
                if(newPassword.length < 6) {
                    alert('密码长度至少6位');
                    return;
                }
                
                $.ajax({
                    url: `/web/admin/api/users/${userId}`,
                    method: 'PUT',
                    contentType: 'application/json',
                    data: JSON.stringify({
                        password: hashPassword(newPassword)
                    }),
                    success: function() {
                        alert('密码修改成功');
                        closePasswordModal();
                        loadUsers(usersPage);
                    },
                    error: function(xhr) {
                        alert('修改失败: ' + (xhr.responseJSON?.error || '未知错误'));
                    }
                });
            });
        }

        function showPasswordModal(title, body, onConfirm) {
            $('#passwordModalTitle').text(title);
            $('#passwordModalBody').html(body);
            passwordModalCallback = onConfirm;
            $('#passwordModal').addClass('show');
        }

        function closePasswordModal() {
            $('#passwordModal').removeClass('show');
            passwordModalCallback = null;
            passwordModalData = {};
        }

        function confirmPasswordChange() {
            if(passwordModalCallback) {
                passwordModalCallback();
            }
        }

        function logout() {
            $.post('/web/api/logout', function() {
                window.location.href = '/web/login';
            });
        }

        $(document).ready(function() {
            loadCurrentUserInfo(function() {
                loadStats();
                loadPendingUsers();
                loadUsers();
            });
        });
    </script>
</body>
</html>
