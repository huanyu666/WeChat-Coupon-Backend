<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商家查询登录</title>
    <link rel="stylesheet" href="/web/static/css/theme.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Inter", "PingFang SC", "Microsoft YaHei", sans-serif;
            background:
                radial-gradient(circle at top left, rgba(125, 211, 252, 0.8), transparent 28%),
                radial-gradient(circle at bottom right, rgba(153, 246, 228, 0.85), transparent 30%),
                radial-gradient(circle at 55% 38%, rgba(196, 181, 253, 0.38), transparent 24%),
                var(--bg-main);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: var(--text-primary);
        }

        .login-shell {
            width: min(100%, 460px);
            background: rgba(255, 255, 255, 0.92);
            border: 1px solid rgba(168, 108, 18, 0.14);
            border-radius: 28px;
            padding: 34px 28px 28px;
            box-shadow: 0 24px 70px rgba(143, 93, 14, 0.18);
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        .login-shell::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at top right, rgba(255, 210, 132, 0.32), transparent 28%),
                linear-gradient(160deg, rgba(255,255,255,0.24), transparent 48%);
            pointer-events: none;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--accent-soft);
            color: var(--accent-strong);
            padding: 8px 14px;
            border-radius: 999px;
            font-size: 13px;
            margin-bottom: 18px;
            position: relative;
            z-index: 1;
        }

        h1 {
            margin: 0 0 10px;
            font-size: clamp(28px, 4vw, 36px);
            line-height: 1.1;
            letter-spacing: 0.04em;
            position: relative;
            z-index: 1;
        }

        .subtitle {
            margin: 0 0 24px;
            color: var(--text-secondary);
            line-height: 1.6;
            font-size: 14px;
            position: relative;
            z-index: 1;
        }

        .field {
            margin-bottom: 16px;
            position: relative;
            z-index: 1;
        }

        .field label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            color: #64748b;
        }

        .field input {
            width: 100%;
            border: 1px solid rgba(148, 163, 184, 0.24);
            border-radius: 16px;
            padding: 14px 15px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.78);
            color: #1e293b;
            box-sizing: border-box;
        }

        .field input:focus {
            outline: none;
            border-color: rgba(37, 99, 235, 0.42);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
        }

        .captcha-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 132px;
            gap: 12px;
            align-items: center;
        }

        #captchaImage {
            width: 132px;
            height: 56px;
            object-fit: contain;
            border-radius: 16px;
            border: 1px solid rgba(148, 163, 184, 0.24);
            background: rgba(255, 255, 255, 0.78);
            cursor: pointer;
            padding: 4px;
        }

        .submit-btn {
            width: 100%;
            border: 0;
            border-radius: 18px;
            padding: 15px 18px;
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 14px 30px rgba(37, 99, 235, 0.22);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            position: relative;
            z-index: 1;
        }

        .submit-btn:disabled {
            opacity: 0.7;
            cursor: wait;
        }

        .submit-btn:not(:disabled):hover {
            transform: translateY(-1px);
            box-shadow: 0 18px 34px rgba(37, 99, 235, 0.28);
        }

        .message {
            min-height: 22px;
            margin: 14px 0 6px;
            font-size: 14px;
            position: relative;
            z-index: 1;
        }

        .message.error {
            color: #b42318;
        }

        .message.success {
            color: #147a34;
        }

        .link-row {
            margin-top: 22px;
            display: flex;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            font-size: 13px;
            position: relative;
            z-index: 1;
        }

        .link-row a {
            color: #64748b;
            text-decoration: none;
        }

        @media (min-width: 900px) {
            body {
                padding: 40px;
            }

            .login-shell {
                padding: 40px 34px 30px;
                border-radius: 32px;
            }

            .subtitle {
                max-width: 34ch;
            }
        }

        @media (max-width: 480px) {
            body {
                align-items: stretch;
                padding: 14px;
            }

            .login-shell {
                padding: 24px 18px 20px;
                border-radius: 24px;
                min-height: calc(100vh - 28px);
                display: flex;
                flex-direction: column;
                justify-content: center;
            }

            h1 {
                font-size: 26px;
            }

            .captcha-row {
                grid-template-columns: 1fr;
            }

            #captchaImage {
                width: 100%;
                height: 64px;
            }

            .link-row {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
        }

        @media (max-width: 360px) {
            .login-shell {
                padding: 20px 14px 18px;
            }

            .badge {
                font-size: 12px;
                padding: 7px 12px;
            }
        }
        body {
            font-family: "Inter", "PingFang SC", "Microsoft YaHei", sans-serif;
            color: var(--text-primary);
            background:
                radial-gradient(circle at top left, rgba(125, 211, 252, 0.8), transparent 28%),
                radial-gradient(circle at bottom right, rgba(153, 246, 228, 0.85), transparent 30%),
                radial-gradient(circle at 55% 38%, rgba(196, 181, 253, 0.38), transparent 24%),
                var(--bg-main);
        }

        .login-shell {
            border-radius: 24px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-top-color: var(--glass-highlight);
            border-left-color: var(--glass-highlight);
            box-shadow: var(--shadow-md);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
        }

        .login-shell::before {
            display: none;
        }

        .badge {
            background: var(--accent-soft);
            color: var(--accent-strong);
            border-radius: 10px;
        }

        h1 {
            color: var(--text-primary);
            letter-spacing: 0;
        }

        .subtitle,
        .field label,
        .link-row a {
            color: var(--text-secondary);
        }

        .field input {
            border: 1px solid rgba(148, 163, 184, 0.24);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.74);
            color: var(--text-primary);
        }

        .field input:focus {
            border-color: rgba(37, 99, 235, 0.42);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
        }

        #captchaImage {
            border: 1px solid rgba(148, 163, 184, 0.24);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.76);
        }

        .submit-btn {
            border-radius: 12px;
            background: linear-gradient(135deg, var(--accent), var(--accent-strong));
            box-shadow: 0 16px 34px rgba(37, 99, 235, 0.2);
        }
    </style>
</head>
<body>
    <div class="login-shell">
        <div class="badge">美团商家查询</div>
        <h1>商家查询登录</h1>
        <p class="subtitle">请输入账号信息后登录。</p>

        <form id="loginForm">
            <div class="field">
                <label for="username">用户名</label>
                <input id="username" name="username" type="text" autocomplete="username" required>
            </div>

            <div class="field">
                <label for="password">密码</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required>
            </div>

            <div class="field">
                <label for="captcha">验证码</label>
                <div class="captcha-row">
                    <input id="captcha" name="captcha" type="text" maxlength="8" placeholder="请输入验证码" required>
                    <img id="captchaImage" alt="验证码" title="点击刷新验证码">
                </div>
            </div>

            <button id="submitBtn" class="submit-btn" type="submit">进入商家查询</button>
            <div id="message" class="message"></div>
        </form>

        <div class="link-row">
            <a href="/web/login">订单查询登录</a>
            <a href="/web/qrcode">二维码生成器</a>
        </div>
    </div>

    <script>
        let captchaId = '';

        function hashPassword(password) {
            return CryptoJS.SHA256(password).toString();
        }

        function showMessage(text, type) {
            const message = document.getElementById('message');
            message.textContent = text;
            message.className = `message ${type || ''}`.trim();
        }

        async function refreshCaptcha() {
            const img = document.getElementById('captchaImage');
            img.style.opacity = '0.5';
            try {
                const response = await fetch(`/web/api/captcha?t=${Date.now()}`, { credentials: 'same-origin' });
                if (!response.ok) {
                    throw new Error('获取验证码失败');
                }

                captchaId = (response.headers.get('X-Captcha-ID') || '').trim();
                const blob = await response.blob();
                const objectUrl = URL.createObjectURL(blob);
                if (img.dataset.blobUrl) {
                    URL.revokeObjectURL(img.dataset.blobUrl);
                }
                img.dataset.blobUrl = objectUrl;
                img.src = objectUrl;
            } catch (error) {
                showMessage(error.message || '获取验证码失败', 'error');
            } finally {
                img.style.opacity = '1';
            }
        }

        async function submitLogin(event) {
            event.preventDefault();

            const button = document.getElementById('submitBtn');
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const captcha = document.getElementById('captcha').value.trim().toUpperCase();

            if (!username || !password || !captcha) {
                showMessage('请填写完整信息', 'error');
                return;
            }
            if (!captchaId) {
                showMessage('验证码已失效，正在刷新', 'error');
                refreshCaptcha();
                return;
            }

            button.disabled = true;
            showMessage('正在登录...', 'success');

            try {
                const response = await fetch('/web/api/login', {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username,
                        password: hashPassword(password),
                        captcha_id: captchaId,
                        captcha
                    })
                });

                const payload = await response.json().catch(() => ({}));
                if (!response.ok) {
                    throw new Error(payload.error || '登录失败');
                }

                showMessage('登录成功，正在跳转...', 'success');
                setTimeout(() => {
                    window.location.href = '/web/shop-query';
                }, 120);
            } catch (error) {
                showMessage(error.message || '登录失败', 'error');
                refreshCaptcha();
            } finally {
                button.disabled = false;
            }
        }

        document.getElementById('loginForm').addEventListener('submit', submitLogin);
        document.getElementById('captchaImage').addEventListener('click', refreshCaptcha);
        refreshCaptcha();
    </script>
</body>
</html>
